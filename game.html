function renderApi(){
  let h='';
  h+='<h4>The language is Python</h4><dl><dd style="margin-bottom:8px">'+
     'Write ordinary Python: <code>if / elif / else</code>, <code>while</code>, <code>for x in range()</code>, '+
     '<code>def</code> with default and keyword arguments, <code>lambda</code>, list and dict comprehensions, '+
     'tuples and unpacking (<code>a, b = b, a</code>), slicing (<code>a[::-1]</code>), f-strings, '+
     'chained comparisons (<code>0 &lt;= x &lt; n</code>), <code>global</code>, and the usual list, dict and str methods. '+
     'Errors read like Python’s: <code>NameError</code>, <code>IndexError</code>, <code>KeyError</code>, <code>TypeError</code>.'+
     '</dd><dd style="margin-bottom:8px">Not supported: classes, <code>import</code>, <code>try / except</code>, sets and generators. '+
     'Whole numbers and decimals are one type, so <code>4 / 2</code> prints <code>2</code> where Python prints <code>2.0</code>. '+
     'Everything else here is checked against CPython.</dd></dl>';
  h+='<h4>Every call costs one step</h4><dl><dd style="margin-bottom:8px">Time in the dish only moves when the bot acts. Anything marked <em>Free</em> is pure bookkeeping and costs nothing — everything else advances the clock by one, and that is what makes growth take time.'+
     '</dd><dd style="margin-bottom:8px">The exception is a <code>harvest()</code> that finds nothing, which costs two. '+
     'Failed actions flash red on the dish and add to the <em>wasted</em> count in the status bar — if that number climbs fast, your program is paying for work it never does.</dd></dl>';
  let open=false;
  for(const e of API){
    if(e.h){ if(open) h+='</dl>'; h+='<h4>'+e.h+'</h4><dl>'; open=true; continue; }
    const locked=e.f&&!W.feats.has(e.f);
    h+='<dt class="'+(locked?'lk':'')+'">'+e.s+(locked?' — locked':'')+'</dt><dd>'+e.d+'</dd>';
  }
  if(open) h+='</dl>';
  h+='<h4>Species</h4>';
  for(const k in SPECIES){
    const s=SPECIES[k], known=W.species.has(k);
    h+='<div class="sp"><span class="dot" style="background:'+(known?s.col:'#33403d')+'"></span><span class="sn" style="color:'+(known?s.col:'#4e615c')+'">'+k+(known?'':' — locked')+'</span></div>';
    {
      let bits=[s.growVar?(s.growVar[0]+'–'+s.growVar[1]+' steps to mature, rolled per planting'):(s.grow+' steps to mature')];
      bits.push(s.sterile?'needs STERILE substrate':'grows on any substrate');
      if(s.cost){ const c=[]; for(const r in s.cost) c.push(s.cost[r]+' '+r); bits.push('costs '+c.join(', ')+' to seed'); }
      h+='<dd style="margin-left:16px">'+bits.join(' · ')+'. '+SPECIES_NOTE[k]+
         (s.fade?' Holds full value for '+s.peak+' steps once ripe, then the payout ramps down to 1 over the next '+
           s.fade+' — the ring drains as it goes.'+
           (s.life?' After '+s.life+' steps ripe it rots away and the cell is lost.'
                  :' It never dies outright, so a late harvest costs you yield rather than the crop.'):
           ' Never spoils.')+'</dd>';
    }
  }
  els.apipane.innerHTML=h;
}
const SPECIES_NOTE={

  MYCELIUM:'Pays 1 enzyme plus 1 for each ripe mycelium orthogonally touching it at the moment you harvest. A lone one pays 1 for its seed cost, which is a bad trade; one in the middle of a ripe patch pays 5. Plant it in blocks, let the whole block ripen, and watch the filaments light up — only glowing links count. Harvesting removes a neighbour, so the order you harvest a patch in changes the total.',
  BIOFILM:'Harvesting one cell takes the whole connected patch and pays the <em>square</em> of its size — but only if every cell in it is mature; otherwise nothing happens. '+

    'best layout is several separated patches rather than one that fills the dish. Leaving the middle row and column bare '+
    'splits any dish into four colonies that each pay their own square.',
  STRAND:'Pays the square of the unbroken run of ripe strand it sits in, along its row, counting round the dish edge. '+

/* --- canvas --- */
const FLASH_MS=420, POP_MS=900, FX_MS=620;
/* Payout numbers that rise off the cell they came from. Real time, not steps,
   so they stay readable whether you are at 8/s or 3000/s. */
/* One floating number per harvest reads well at eight steps a second. At three
   thousand it is several hundred overlapping numbers a second, none of them
   legible and none of them saying anything the per-step rate under each resource
   does not already say. So a payout is not drawn when it happens - it goes in a
   buffer that is merged once per frame, one figure per resource, placed where
   the bot ended up. At one tick per frame that is exactly the old behaviour. */
function pop(x,y,text,col,amount){
  if(amount===undefined){ W.pops.push({x,y,text,col,t:performance.now()}); trimPops(); return; }
  const b=RT.popBuf;
  for(const e of b) if(e.col===col){ e.n+=amount; e.x=x; e.y=y; return; }
  b.push({x,y,col,n:amount});
}
function trimPops(){ if(W.pops.length>24) W.pops.splice(0,W.pops.length-24); }
function flushFrameFx(){
  if(RT.popBuf.length){
    const now=performance.now();
    for(const e of RT.popBuf) W.pops.push({x:e.x,y:e.y,text:'+'+e.n,col:e.col,t:now});
    RT.popBuf.length=0;
    trimPops();
  }
  if(RT.fxBuf.length){
    const now=performance.now();
    for(const e of RT.fxBuf){
      W.fx.push({kind:e.kind,x:e.x,y:e.y,col:e.col,cells:e.cells,t:now,seed:(e.x*31+e.y*17)%360});
    }
    RT.fxBuf.length=0;
    if(W.fx.length>36) W.fx.splice(0,W.fx.length-36);
  }
}
/* Every harvest used to look the same: a number floating up. On a dish running
   four crops at once the number is the one thing you cannot read at speed, so
   each species now leaves a shape of its own and you can tell what came in from
   the other side of the room. */
/* Same problem, same answer: at most one burst per species per frame. A shape
   drawn four hundred times over itself is a solid block of colour. */
function burst(kind,x,y,col,cells){
  const b=RT.fxBuf;
  for(const e of b) if(e.kind===kind){ e.x=x; e.y=y; e.cells=cells||e.cells; return; }
  b.push({kind,x,y,col,cells:cells||null});
}
function jumpFx(x0,y0,x1,y1){
  W.fx.push({kind:'JUMP',x:x1,y:y1,from:[x0,y0],col:'#7fd7ff',cells:null,t:performance.now(),seed:0});
  if(W.fx.length>36) W.fx.splice(0,W.fx.length-36);
}
function drawFx(pad,cs,n){
  if(!W.fx.length) return;
  const now=performance.now();
  const mid=(x,y)=>[pad+x*cs+cs/2,pad+y*cs+cs/2];
  ctx.save();
  ctx.lineCap='round';
  for(let i=W.fx.length-1;i>=0;i--){
    const q=W.fx[i], age=now-q.t;
    if(age>=FX_MS||q.x>=n||q.y>=n){ W.fx.splice(i,1); continue; }
    const k=age/FX_MS, fade=1-k, ease=1-Math.pow(1-k,3);
    const [mx,my]=mid(q.x,q.y);
    ctx.globalAlpha=fade;
    ctx.strokeStyle=q.col; ctx.fillStyle=q.col;
    if(q.kind==='CULTURE'){
      /* a ring pushing out, the way a colony spreads */
      ctx.lineWidth=Math.max(1.5,cs*0.10*fade);
      ctx.beginPath(); ctx.arc(mx,my,cs*(0.12+0.42*ease),0,Math.PI*2); ctx.stroke();
    }
    else if(q.kind==='SPORE'){
      /* a puff of spores thrown clear */
      for(let a=0;a<9;a++){
        const ang=(q.seed+a*40)*Math.PI/180, d=cs*(0.08+0.50*ease);
        ctx.beginPath();
        ctx.arc(mx+Math.cos(ang)*d,my+Math.sin(ang)*d,Math.max(1.5,cs*0.085*fade),0,Math.PI*2);
        ctx.fill();
      }
    }
    else if(q.kind==='MYCELIUM'){
      /* the links snap back toward the cell that took them */
      ctx.lineWidth=Math.max(1.5,cs*0.09*fade);
      for(let a=0;a<4;a++){
        const ang=a*Math.PI/2, near=cs*(0.10+0.34*ease), far=cs*(0.46+0.16*ease);
        ctx.beginPath();
        ctx.moveTo(mx+Math.cos(ang)*near,my+Math.sin(ang)*near);
        ctx.lineTo(mx+Math.cos(ang)*far,my+Math.sin(ang)*far);
        ctx.stroke();
      }
    }
    else if(q.kind==='BIOFILM'){
      /* the whole colony lifts off together */
      const cells=q.cells||[[q.x,q.y]];
      ctx.globalAlpha=fade*fade*0.55;
      for(const c of cells){
        if(c[0]>=n||c[1]>=n) continue;
        const [px,py]=mid(c[0],c[1]);
        const r=cs*0.44*(1+0.28*ease);
        rr(px-r,py-r,r*2,r*2,r*0.30);
        ctx.fill();
      }
      ctx.globalAlpha=fade;
      ctx.lineWidth=Math.max(1.5,cs*0.08*fade);
      for(const c of cells){
        if(c[0]>=n||c[1]>=n) continue;
        const [px,py]=mid(c[0],c[1]);
        const r=cs*0.44*(1+0.28*ease);
        rr(px-r,py-r,r*2,r*2,r*0.30);
        ctx.stroke();
      }
    }
    else if(q.kind==='CRYSTAL'){
      /* facets thrown off the lattice */
      ctx.lineWidth=Math.max(1.2,cs*0.07*fade);
      for(let a=0;a<5;a++){
        const ang=(q.seed+45+a*72)*Math.PI/180, d=cs*(0.08+0.52*ease), r=cs*0.15*fade;
        const px=mx+Math.cos(ang)*d, py=my+Math.sin(ang)*d;
        ctx.beginPath();
        ctx.moveTo(px,py-r); ctx.lineTo(px+r,py); ctx.lineTo(px,py+r); ctx.lineTo(px-r,py);
        ctx.closePath(); ctx.fill();
      }
    }
    else if(q.kind==='STRAND'){
      /* a pulse running the length of the row it took */
      const cells=q.cells||[[q.x,q.y]];
      ctx.globalAlpha=fade*0.85;
      ctx.lineWidth=Math.max(2,cs*0.20*fade);
      for(const c of cells){
        if(c[0]>=n||c[1]>=n) continue;
        const [px,py]=mid(c[0],c[1]);
        ctx.beginPath(); ctx.moveTo(px-cs*0.44,py); ctx.lineTo(px+cs*0.44,py); ctx.stroke();
      }
    }
    else if(q.kind==='JUMP'){
      /* drawn straight rather than wrapped: the point is where it went, and a
         line leaving one edge to reappear at the other reads as noise */
      const f=q.from;
      if(f&&f[0]<n&&f[1]<n){
        const fm=mid(f[0],f[1]);
        ctx.globalAlpha=fade*fade*0.8;
        ctx.lineWidth=Math.max(1.5,cs*0.10*fade);
        ctx.setLineDash([cs*0.16,cs*0.12]);
        ctx.beginPath(); ctx.moveTo(fm[0],fm[1]); ctx.lineTo(mx,my); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha=fade;
        ctx.beginPath(); ctx.arc(mx,my,cs*(0.14+0.30*ease),0,Math.PI*2); ctx.stroke();
      }
    }
    else if(q.kind==='PAYLOAD'){
      ctx.lineWidth=Math.max(2,cs*0.12*fade);
      for(const r of [0.2,0.45,0.7]){
        ctx.beginPath(); ctx.arc(mx,my,cs*(r+0.5*ease),0,Math.PI*2); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawPops(pad,cs,n){
  if(!W.pops.length) return;
  const now=performance.now();
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=W.pops.length-1;i>=0;i--){
    const q=W.pops[i], age=now-q.t;
    if(age>=POP_MS||q.x>=n||q.y>=n){ W.pops.splice(i,1); continue; }
    const k=age/POP_MS;
    const px=pad+q.x*cs+cs/2, py=pad+q.y*cs+cs/2-k*cs*0.75;
    ctx.globalAlpha=k<0.15?(k/0.15):(1-(k-0.15)/0.85);
    ctx.font='600 '+Math.max(11,Math.round(cs*0.30))+'px "IBM Plex Mono",monospace';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(4,10,9,.85)';
    ctx.strokeText(q.text,px,py);
    ctx.fillStyle=q.col;
    ctx.fillText(q.text,px,py);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
const BOT_COL=[{line:'#4fe3c1',fill:'rgba(79,227,193,.14)'},
               {line:'#b98cff',fill:'rgba(185,140,255,.14)'}];
/* past its peak a cell slides from its own colour toward rot red, so you can
   see a crop going off before you lose it */
function hexMix(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const m=(sh)=>Math.round((((pa>>sh)&255)*(1-t))+(((pb>>sh)&255)*t));
  return 'rgb('+m(16)+','+m(8)+','+m(0)+')';
}
const ROT='#ff6b5e';
function cellColor(c){
  const f=freshness(c);
  return f>=1?SPECIES[c.s].col:hexMix(SPECIES[c.s].col,ROT,Math.min(1,(1-f)*0.85));
}
const ctx=els.dish.getContext('2d');
let cw=400,ch=400;
function fitCanvas(){
  const r=els.stage.getBoundingClientRect();
  const s=Math.max(160,Math.min(r.width-28,r.height-28));
  cw=ch=s;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  els.dish.width=Math.round(s*dpr); els.dish.height=Math.round(s*dpr);
  els.dish.style.width=s+'px'; els.dish.style.height=s+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(){
  const n=W.size, pad=cw*0.055, inner=cw-pad*2, cs=inner/n, gap=Math.max(1.5,cs*0.07);
  ctx.clearRect(0,0,cw,ch);
  // dish rim
  ctx.save();
  ctx.beginPath(); ctx.arc(cw/2,ch/2,cw/2-2,0,Math.PI*2);
  const g=ctx.createRadialGradient(cw/2,ch*0.30,cw*0.05,cw/2,ch/2,cw/2);
  g.addColorStop(0,'#16302b'); g.addColorStop(0.55,'#0e1f1c'); g.addColorStop(1,'#080f0f');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#2c5a50'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cw/2,ch/2,cw/2-7,0,Math.PI*2);
  ctx.strokeStyle='rgba(79,227,193,.18)'; ctx.lineWidth=1; ctx.stroke();
  /* a slow sheen across the glass, the one thing on screen that moves when the
     program is stopped */
  const sh=ctx.createLinearGradient(0,0,cw,ch);
  const ph=(performance.now()/5200)%1;
  sh.addColorStop(Math.max(0,ph-0.18),'rgba(79,227,193,0)');
  sh.addColorStop(ph,'rgba(120,255,225,.045)');
  sh.addColorStop(Math.min(1,ph+0.18),'rgba(79,227,193,0)');
  ctx.beginPath(); ctx.arc(cw/2,ch/2,cw/2-3,0,Math.PI*2);
  ctx.fillStyle=sh; ctx.fill();
  ctx.restore();

  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const c=cell(x,y);
    const cx=pad+x*cs, cy=pad+y*cs;
    const bx=cx+gap/2, by=cy+gap/2, bs=cs-gap;
    if(c.w){
      rr(bx,by,bs,bs,Math.min(3,bs*0.10));
      ctx.fillStyle='#1a2b33'; ctx.fill();
      ctx.strokeStyle='rgba(127,215,255,.20)'; ctx.lineWidth=1; ctx.stroke();
      continue;
    }
    rr(bx,by,bs,bs,Math.min(5,bs*0.16));
    if(c.g==='fouled'){
      /* deliberately the ugliest thing on the dish, and the only warm colour on
         it, so a patch spreading is visible from across the room */
      const due=Math.max(0,Math.min(1,(W.tick-(c.ft||0))/FOUL_SPREAD));
      ctx.fillStyle='#3a2a16'; ctx.fill();
      ctx.strokeStyle='rgba(214,150,58,'+(0.30+0.45*due).toFixed(3)+')';
      ctx.lineWidth=1; ctx.stroke();
      const mx=bx+bs/2, my=by+bs/2;
      ctx.save();
      ctx.fillStyle='#d6963a';
      for(let k=0;k<4;k++){
        const a=(k*97+(x*31+y*17))%360*Math.PI/180, d=bs*0.20;
        ctx.globalAlpha=0.28+0.30*due;
        ctx.beginPath();
        ctx.arc(mx+Math.cos(a)*d,my+Math.sin(a)*d,bs*(0.11+0.06*due),0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      continue;
    }
    if(c.g==='sterile'){
      /* The blue drains out of treated agar as the treatment is used up, so a
         bed going off is visible before substrate() has to tell you. */
      const q=Math.max(0,Math.min(1,(c.sc||0)/STERILE_CROPS));
      ctx.fillStyle='rgb('+Math.round(14+12*q)+','+Math.round(26+20*q)+','+Math.round(28+30*q)+')';
      ctx.fill();
      ctx.strokeStyle='rgba(127,215,255,'+(0.05+0.24*q).toFixed(3)+')';
      ctx.lineWidth=1; ctx.stroke();
      if(bs>20){
        ctx.fillStyle='rgba(127,215,255,.10)';
        ctx.fillRect(bx+4,by+bs-4.5,bs-8,2.6);
        ctx.fillStyle='rgba(140,222,255,'+(0.35+0.5*q).toFixed(3)+')';
        ctx.fillRect(bx+4,by+bs-4.5,(bs-8)*q,2.6);
      }
    } else {
      ctx.fillStyle='#0f1c19'; ctx.fill();
      ctx.strokeStyle='rgba(79,227,193,.06)';
      ctx.lineWidth=1; ctx.stroke();
    }

    if(c.s&&!isRotted(c)){
      const sp=SPECIES[c.s], p=growth(c), mat=p>=1;
      const col=cellColor(c), fresh=freshness(c);
      const mx=bx+bs/2, my=by+bs/2;
      ctx.save();
      /* a plain wide fill rather than a shadow blur: at 15x15 that is 225 cells
         a frame and canvas shadows will not carry it */
      if(mat){
        ctx.globalAlpha=0.13*(0.55+0.45*fresh);
        ctx.fillStyle=col;
        ctx.beginPath(); ctx.arc(mx,my,bs*0.62,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
      if(c.s==='STRAND'){
        // links east/west only, and only bright when both ends would count
        for(const dx of [1,-1]){
          const nb=cell(wrap(x+dx),y);
          if(nb.s!=='STRAND') continue;
          const joined=mat&&isMature(nb);
          ctx.strokeStyle=col;
          ctx.globalAlpha=joined?0.9:0.15;
          ctx.lineWidth=joined?Math.max(2,bs*0.16):Math.max(1,bs*0.05);
          ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+dx*cs*0.5,my); ctx.stroke();
        }
        ctx.globalAlpha=1;
        const w=bs*0.44*(0.4+0.6*p), hh=bs*0.20*(0.5+0.5*p);
        rr(mx-w,my-hh,w*2,hh*2,hh);
        ctx.fillStyle=col; ctx.globalAlpha=0.35+0.5*p; ctx.fill(); ctx.globalAlpha=1;
        if(mat){ ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke(); }
      }
      else if(c.s==='MYCELIUM'){
        ctx.strokeStyle=col;
        for(const q of neighbours(x,y)){
          const nb=cell(q[0],q[1]);
          if(nb.s!=='MYCELIUM') continue;
          if(Math.abs(q[0]-x)>1||Math.abs(q[1]-y)>1) continue;
          // a link only pays if BOTH ends are ripe, so only those glow
          const live=mat&&isMature(nb);
          ctx.globalAlpha=live?0.9:0.18;
          ctx.lineWidth=live?Math.max(1.6,bs*0.11):Math.max(1,bs*0.045);
          ctx.beginPath(); ctx.moveTo(mx,my);
          ctx.lineTo(pad+q[0]*cs+cs/2,pad+q[1]*cs+cs/2); ctx.stroke();
        }
        ctx.globalAlpha=1;
      }
      if(c.s==='BIOFILM'){
        const r=bs*0.5*(0.4+0.6*p);
        rr(mx-r,my-r,r*2,r*2,r*0.3);
        ctx.fillStyle=col; ctx.globalAlpha=0.30+0.5*p; ctx.fill(); ctx.globalAlpha=1;
        if(mat){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke(); }
      } else if(c.s==='CRYSTAL'){
        const r=bs*0.40*(0.45+0.55*p);
        ctx.beginPath();
        ctx.moveTo(mx,my-r); ctx.lineTo(mx+r,my); ctx.lineTo(mx,my+r); ctx.lineTo(mx-r,my);
        ctx.closePath();
        ctx.fillStyle=col; ctx.globalAlpha=0.30+0.55*p; ctx.fill(); ctx.globalAlpha=1;
        if(mat){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke(); }
        if(bs>26){
          ctx.fillStyle= mat?'#05171d':sp.col;
          ctx.globalAlpha= mat?0.9:0.55;
          ctx.font='600 '+Math.round(bs*0.28)+'px "IBM Plex Mono",monospace';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(String(c.f),mx,my+0.5);
          ctx.globalAlpha=1;
        }
      } else {
        const r=bs*0.42*(0.42+0.58*p);
        ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2);
        ctx.fillStyle=col; ctx.globalAlpha=0.42+0.42*p; ctx.fill(); ctx.globalAlpha=1;
      }
      /* every occupied cell gets a faint boundary, so a freshly seeded one is
         never mistaken for bare agar */
      ctx.beginPath(); ctx.arc(mx,my,bs*0.44,0,Math.PI*2);
      ctx.strokeStyle=col; ctx.globalAlpha=0.22; ctx.lineWidth=1; ctx.stroke(); ctx.globalAlpha=1;
      if(mat){
        ctx.beginPath();
        if(fresh>=1){
          ctx.arc(mx,my,bs*0.46,0,Math.PI*2);
          ctx.globalAlpha=0.5;
        } else {
          // the ring drains clockwise as the yield ramps down
          ctx.arc(mx,my,bs*0.46,-Math.PI/2,-Math.PI/2+Math.PI*2*fresh);
          ctx.globalAlpha=0.85;
        }
        ctx.strokeStyle=col; ctx.lineWidth=fresh>=1?1.2:2; ctx.stroke(); ctx.globalAlpha=1;
      }
      ctx.restore();
    }

    if(W.maze&&x===W.tx&&y===W.ty){
      const mx=bx+bs/2, my=by+bs/2, r=bs*0.28;
      ctx.save();
      ctx.beginPath();
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2, px=mx+Math.cos(a)*r, py=my+Math.sin(a)*r;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.shadowColor='#7fd7ff'; ctx.shadowBlur=bs*0.45;
      ctx.fillStyle='#7fd7ff'; ctx.fill();
      ctx.restore();
    }
  }

  // bots
  for(let b=0;b<W.bots.length;b++){
    const bot=W.bots[b], col=BOT_COL[b%BOT_COL.length];
    const bxc=pad+bot.px*cs+cs/2, byc=pad+bot.py*cs+cs/2, br=cs*0.30;
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=Math.PI/6+i*Math.PI/3;
      const px=bxc+Math.cos(a)*br, py=byc+Math.sin(a)*br;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=col.fill; ctx.fill();
    ctx.strokeStyle=col.line; ctx.lineWidth=Math.max(1.4,cs*0.045); ctx.stroke();
    ctx.beginPath(); ctx.arc(bxc,byc,Math.max(1.5,br*0.2),0,Math.PI*2);
    ctx.fillStyle=col.line; ctx.fill();
    if(W.bots.length>1&&cs>30){
      ctx.font='600 '+Math.round(cs*0.2)+'px "IBM Plex Mono",monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=col.line; ctx.globalAlpha=.85;
      ctx.fillText(String(b),bxc,byc-br-cs*0.13);
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  drawFx(pad,cs,n);
  drawPops(pad,cs,n);

  // a wasted action leaves a fading red cross on the cell it happened in
  if(W.flash){
    const age=performance.now()-W.flash.t;
    if(age>=FLASH_MS) W.flash=null;
    else if(W.flash.x<n&&W.flash.y<n){
      const a=1-age/FLASH_MS;
      const fx=pad+W.flash.x*cs+cs/2, fy=pad+W.flash.y*cs+cs/2;
      const r=cs*0.30*(1.4-0.4*a), k=r*0.45;
      ctx.save();
      ctx.globalAlpha=a;
      ctx.strokeStyle='#ff6b5e';
      ctx.lineWidth=Math.max(1.5,cs*0.045);
      ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(fx-k,fy-k); ctx.lineTo(fx+k,fy+k);
      ctx.moveTo(fx+k,fy-k); ctx.lineTo(fx-k,fy+k);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* --- status --- */
function renderStatus(){
  if(trialNote&&W.trial)
    trialNote.textContent=RT.running?(Math.max(0,W.trial.endTick-W.tick)+' steps left')
                                    :'ready — press Run';
  els.status.innerHTML=
    (W.trial?'<span style="color:#ffb54d">▸ '+W.trial.def.nm+' <b>'+
        Math.max(0,W.trial.endTick-W.tick)+'</b> left</span>':'')+
    (W.stage?(function(){ const pr=stageProgress();
        return '<span style="color:#8ef58a">\u25b8 '+W.stage.def.nm+' <b>'+pr.now+' / '+pr.target+'</b>'+
               (W.stage.def.kind==='streak'&&W.stage.best>pr.now?' (best '+W.stage.best+')':'')+'</span>'; })():'')+
    'step <b>'+W.tick+'</b>'+
    '<span>pos <b>'+W.bots.map(function(b){ return b.x+','+b.y; }).join('  ')+'</b></span>'+
    (W.trial?'':'<span>dish <b>'+W.size+'×'+W.size+(W.maze?' labyrinth':'')+'</b></span>')+
    '<span>last <b'+(W.lastOk?'':' style="color:#ff6b5e"')+'>'+W.lastAct+
      (W.lastOk?'':' ✗')+'</b></span>'+
    '<span>wasted <b'+(W.wasted?' style="color:#ff6b5e"':'')+'>'+W.wasted+'</b></span>'+
    '<span>'+(!RT.running?'idle':RT.paused
        ?'<b style="color:#ffb54d">paused</b>'
        :'<b style="color:#4fe3c1">running</b>')+'</span>';
}
function updateSpeedLabel(){
  const mi=maxSpeedIdx();
  if(+els.spd.value>mi) els.spd.value=mi;
  els.spd.max=String(mi);
  els.spdv.textContent=currentSpeed()+'/s';
}

/* --- main loop --- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.25,(now-last)/1000); last=now;
  if(RT.running&&!RT.paused){
    RT.acc+=dt*currentSpeed();
    const budget=Math.floor(RT.acc);
    if(budget>0){
      RT.acc-=budget;
      RT.ticksFrame=0;
      pump(budget);
    }
  }
  flushFrameFx();
  lastFrameTicks=RT.ticksFrame;
  const k=Math.min(1,dt*14);
  for(const b of W.bots){
    b.px+=(b.x-b.px)*k; b.py+=(b.y-b.py)*k;
    if(Math.abs(b.px-b.x)<0.002) b.px=b.x;
    if(Math.abs(b.py-b.y)<0.002) b.py=b.y;
  }
  draw(); paintLines();
  sync();
  requestAnimationFrame(frame);
}
let lastSig='', lastASig='';
function sync(){
  introCheck();
  const sig=W.tick+'|'+RT.running+'|'+W.res.bacteria+'|'+W.res.spores+'|'+W.res.enzymes+'|'+W.res.biomass+'|'+W.res.crystals;
  if(sig!==lastSig){ lastSig=sig; renderRes(); renderStatus(); }
  // the tech panel is expensive to rebuild and hostile to rebuild while you are
  // reading it, so it only redraws when something actually became affordable
  let asig='';
  for(const t of TECH) asig+= W.owned.has(t.id)?'o':canAfford(t.cost)?'a':'p';
  if(asig!==lastASig){ lastASig=asig; renderLab(); }
  if(els.profpane&&!els.profpane.hidden) renderProf();
}

/* ============================================================
   SAVE
   ============================================================ */
/* v2: Python language core, 5x5 starting dish, retuned tech tree.
   A v1 save would load a 3x3 dish and the old starter, so it starts fresh. */
const KEY='petri-automaton-v2';
const GCODE={agar:0,sterile:1,fouled:2}, GNAME=['agar','sterile','fouled'];
const packCell=c=>[GCODE[c.g]||0,c.s,c.t,c.f,c.w?1:0,c.gt||0,c.sc||0,c.seen||0,c.ft||0];
/* a save from before sterility wore off has no sc: treat those cells as freshly
   treated rather than silently spent, so nobody loses a dish to the upgrade */
const unpackCell=a=>({g:GNAME[a[0]]||'agar',s:a[1],t:a[2]||0,f:a[3]||0,w:!!a[4],gt:a[5]||0,
                      sc:a[6]!==undefined?a[6]:(a[0]===1?STERILE_CROPS:0),
                      seen:a[7]||0, ft:a[8]||0});
let saveT=0;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(save,700); }
function save(){
  // a trial's dish is scratch state; writing it would overwrite the real culture
  if(W.trial||W.stage) return;
  try{
    localStorage.setItem(KEY,JSON.stringify({
      code:els.code.value, res:W.res, owned:Array.from(W.owned),
      size:W.size, tick:W.tick, x:W.x, y:W.y,
      grid:W.grid.map(packCell),
      maze:W.maze, tx:W.tx, ty:W.ty, wasted:W.wasted, best:W.best,
      slots:W.slots, slot:W.slot, live:els.live.checked, stats:W.stats, done:W.done,
      seeds:W.seeds||{}, rival:W.rival||{}, hist:W.hist||[], daily:W.daily||null,
      intro:W.intro||{},
      stageBest:W.stageBest||{},
      replantNoticed:true,
      bots:W.bots.map(function(b){ return [b.x,b.y]; }),
      saved:W.saved?{size:W.saved.size,x:W.saved.x,y:W.saved.y,grid:W.saved.grid.map(packCell)}:null,
      spd:els.spd.value, rep:els.rep.checked
    }));
  }catch(e){}
}
function applyOwned(){
  W.feats=new Set(); W.species=new Set(['CULTURE']); W.speedTier=0;
  for(const t of TECH){
    if(!W.owned.has(t.id)) continue;
    if(t.feat) W.feats.add(t.feat);
    if(t.species) W.species.add(t.species);
    if(t.species==='SPORE') W.feats.add('sterile');
    if(t.speed) W.speedTier+=t.speed;
  }
  setBotCount(W.owned.has('twin')?2:1);
}
const STARTER=
'# Press Run. Something will grow, and then the log will tell you\n'+
'# why it stopped working. Fix that, and you have a farm.\n'+
'\n'+
'seed(CULTURE)\n'+
'\n'+
'# Everything you can do right now:\n'+
'#   harvest()      take whatever has finished growing here\n'+
'#   seed(CULTURE)  plant one, in an empty cell\n'+
'#   move(EAST)     one cell east, wrapping round the dish\n'+
'\n'+
'\n';

function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(s&&s.grid&&s.size){
    W.owned=new Set(s.owned||[]);
    applyOwned();
    W.size=s.size; W.res=Object.assign({bacteria:0,spores:0,enzymes:0,biomass:0,crystals:0},s.res||{});
    W.tick=s.tick||0; W.x=Math.min(s.x||0,W.size-1); W.y=Math.min(s.y||0,W.size-1);
    W.grid=s.grid.map(unpackCell);
    if(W.grid.length!==W.size*W.size) initGrid(W.size);
    /* a save written before contamination existed has no neglect clock; start
       its cells now rather than declaring the whole dish overdue */
    if(!Array.isArray(s.grid[0])||s.grid[0].length<8) resetFoulClock();
    W.wasted=s.wasted||0;
    W.best=s.best||{};
    W.stats=s.stats||{};
    W.done=s.done||{};
    W.stageBest=s.stageBest||{};
    W.seeds=s.seeds||{}; W.rival=s.rival||{};
    W.hist=Array.isArray(s.hist)?s.hist:[];
    W.daily=s.daily||null;
    W.intro=s.intro||{};
    W.slots=Array.isArray(s.slots)?s.slots:[];
    W.slot=s.slot||0;
    if(Array.isArray(s.bots)&&s.bots.length){
      setBotCount(s.bots.length);
      s.bots.forEach(function(q,i){ W.bots[i].x=q[0]; W.bots[i].y=q[1]; W.bots[i].px=q[0]; W.bots[i].py=q[1]; });
    }
    if(s.live!==undefined) els.live.checked=!!s.live;
    W.maze=!!s.maze;
    W.tx=s.tx===undefined?-1:s.tx; W.ty=s.ty===undefined?-1:s.ty;
    W.saved=s.saved?{size:s.saved.size,x:s.saved.x,y:s.saved.y,grid:s.saved.grid.map(unpackCell)}:null;
    if(W.maze&&!W.saved) W.maze=false;   // never strand the player inside a labyrinth
    els.code.value=s.code!==undefined?s.code:STARTER;
    if(s.spd!==undefined) els.spd.value=s.spd;
    if(s.rep!==undefined) els.rep.checked=!!s.rep;
    /* Seeder attachment was a passive that refilled every harvested cell. A loop
       written against that has no seed() of its own and would quietly farm an
       empty dish now, so anyone holding the tech gets told once. */
    if(W.owned.has('replant')&&!s.replantNoticed) needReplantNotice=true;
  } else {
    initGrid(5);
    applyOwned();
    resetFoulClock();
    els.code.value=STARTER;
  }
  W.px=W.x; W.py=W.y;
}
let needReplantNotice=false;
function replantNotice(){
  if(!needReplantNotice) return;
  needReplantNotice=false;
  logLine('Seeder attachment has changed. It used to replant every harvested cell by itself, which '+
    'froze a bed to one crop and broke any seed() on the next line. It is a call now: replant() '+
    'harvests and re-seeds the same species for one action, only where you ask for it. A loop that '+
    'relied on the old behaviour needs a seed() or a replant() adding.','good');
  save();
}

/* ============================================================
   WIRING
   ============================================================ */
els.bRun.addEventListener('click',startRun);
els.bStop.addEventListener('click',()=>stopRun('Stopped.'));
els.bStep.addEventListener('click',singleStep);
els.slotSel.addEventListener('change',function(){ loadSlot(parseInt(els.slotSel.value,10)||0); });
els.slotName.addEventListener('input',function(){
  ensureSlots();
  W.slots[W.slot].name=els.slotName.value.slice(0,24);
  const o=els.slotSel.options[W.slot];
  if(o) o.textContent=(W.slot+1)+'. '+(els.slotName.value||'untitled');
  saveSoon();
});
els.slotNew.addEventListener('click',newSlot);
els.slotDel.addEventListener('click',deleteSlot);
els.bBoard.addEventListener('click',resetBoard);
els.bApply.addEventListener('click',function(){ applyChanges(true); });
els.live.addEventListener('change',function(){ if(els.live.checked) scheduleLive(); saveSoon(); });
els.bClear.addEventListener('click',()=>{ els.console.innerHTML=''; logCount=0; RT.out=0; });
els.bReset.addEventListener('click',()=>{
  if(!confirmReset()) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  stopRun(null);
  W.owned=new Set(); W.res={bacteria:0,spores:0,enzymes:0,biomass:0,crystals:0};
  W.tick=0; W.x=0; W.y=0; W.lastAct='—';
  W.maze=false; W.saved=null; W.tx=-1; W.ty=-1;
  W.wasted=0; W.lastOk=true; W.flash=null; W.best={}; W.trial=null;
  W.slots=[]; W.slot=0; W.stats={}; W.done={}; W.stageBest={}; W.seeds={}; W.rival={}; W.hist=[]; W.daily=null; W.intro={}; W.stage=null; clearRates();
  applyOwned(); initGrid(5); resetFoulClock(); W.px=0; W.py=0;
  els.code.value=STARTER;
  els.console.innerHTML=''; logCount=0; RT.out=0;
  ensureSlots(); renderSlots();
  renderEditor(); renderRes(); renderLab(); renderApi(); renderTrials(); updateSpeedLabel(); renderStatus();
  logLine('Save cleared.','sys');
});
let resetArmed=false, resetT=0;
function confirmReset(){
  if(resetArmed){ resetArmed=false; els.bReset.textContent='reset save'; return true; }
  resetArmed=true; els.bReset.textContent='click again to wipe';
  clearTimeout(resetT);
  resetT=setTimeout(()=>{ resetArmed=false; els.bReset.textContent='reset save'; },3000);
  return false;
}
els.spd.addEventListener('input',()=>{ updateSpeedLabel(); saveSoon(); });
els.rep.addEventListener('change',saveSoon);

document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.p));
    fitCanvas();
  });
});
function showPane(name){
  document.querySelectorAll('.subtabs button').forEach(function(x){
    x.setAttribute('aria-selected',String(x.dataset.s===name));
  });
  els.labpane.hidden = name!=='lab';
  els.trialpane.hidden = name!=='trials';
  els.profpane.hidden = name!=='prof';
  els.apipane.hidden = name!=='api';
  if(name==='trials') renderTrials();
  if(name==='prof') renderProf();
}
document.querySelectorAll('.subtabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.subtabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    els.labpane.hidden = b.dataset.s!=='lab';
    els.trialpane.hidden = b.dataset.s!=='trials';
    els.profpane.hidden = b.dataset.s!=='prof';
    if(b.dataset.s==='prof') renderProf();
    els.apipane.hidden = b.dataset.s!=='api';
    if(b.dataset.s==='trials') renderTrials();
  });
});
window.addEventListener('resize',fitCanvas);
window.addEventListener('beforeunload',save);

/* ---------- boot ---------- */
function start(){
  load();
  ensureSlots(); renderSlots();
  renderEditor(); renderRes(); renderLab(); renderApi(); renderTrials(); renderProf();
  updateSpeedLabel(); renderStatus(); fitCanvas();
  logLine('Nanobot online. '+W.size+' × '+W.size+' dish, agar substrate.','sys');
  logLine('Waiting for a program. Read the editor and write one.','sys');
  replantNotice();
  requestAnimationFrame(f=>{ last=f; frame(f); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
else start();

})();

</script>
