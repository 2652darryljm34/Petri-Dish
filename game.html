<title>Petri Automaton</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --void:#070b0a; --dish:#0c1412; --panel:#101a18; --panel2:#0b1312;
  --line:#1d2b28; --line2:#2a3c38;
  --ink:#d8e6e1; --dim:#7b938c; --faint:#4e615c;
  --cyan:#4fe3c1; --violet:#b98cff; --amber:#ffb54d; --rose:#ff5f8d; --ice:#7fd7ff;
  --warn:#ff6b5e; --ok:#4fe3c1;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --disp:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif;
  --lh:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,#0d1715,#0a110f);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand h1{
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.14em;
  text-transform:uppercase;margin:0;color:var(--ink);
}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.ctl{display:flex;align-items:center;gap:7px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:3px;border:1px solid var(--line2);
  background:#141f1d;cursor:pointer;
  font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover:not(:disabled){background:#1a2825;border-color:#3a534d}
.btn:disabled{opacity:.34;cursor:default}
.btn.run{background:var(--cyan);border-color:var(--cyan);color:#052019}
.btn.run:hover:not(:disabled){background:#68efd0;border-color:#68efd0}
.btn.stop{border-color:#5c2f2c;color:#ff9c92;background:#1c1210}
.btn.stop:hover:not(:disabled){background:#2a1714}
.speed{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.speed input[type=range]{width:96px;accent-color:var(--cyan)}
.chk{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer;user-select:none}
.chk input{accent-color:var(--cyan);margin:0}

/* ---------- tabs (mobile) ---------- */
#tabs{display:none;gap:0;border-bottom:1px solid var(--line);background:var(--panel2)}
#tabs button{
  flex:1;padding:9px 4px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
#tabs button[aria-selected=true]{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ---------- main grid ---------- */
main{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(260px,0.85fr) minmax(380px,1.2fr) 306px;
  gap:1px;background:var(--line);
}
main>section{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--void)}

/* ---------- editor ---------- */
.ph{
  display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel2);
  border-bottom:1px solid var(--line);
  font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
}
.ph .spacer{margin-left:auto}
.ph .tiny{
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);
  text-transform:none;background:none;border:1px solid var(--line2);border-radius:3px;
  padding:2px 7px;cursor:pointer;
}
.ph .tiny:hover{color:var(--ink);border-color:#3a534d}

#bApply{color:var(--cyan);border-color:#2f6b5d;background:#0e1c1a}
#bApply:hover{background:#143029}
#slotbar{
  display:flex;gap:6px;align-items:center;flex:none;
  padding:5px 12px;background:#0a1211;border-bottom:1px solid var(--line);
}
#slotbar select,#slotbar input{
  font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#111c1a;border:1px solid var(--line2);border-radius:3px;padding:3px 6px;
}
#slotbar select{max-width:46%}
#slotbar input{flex:1;min-width:0}
#slotbar input:focus,#slotbar select:focus{outline:1px solid var(--cyan);outline-offset:0}
#ed{position:relative;flex:1;min-height:0;background:var(--panel2);overflow:hidden}
#gutter,#hl,#code{
  position:absolute;inset:0;margin:0;border:0;
  font-family:var(--mono);font-size:12.5px;line-height:var(--lh);
  padding:10px 14px 40px 52px;white-space:pre;tab-size:4;
}
#gutter{
  padding-left:0;padding-right:0;width:42px;right:auto;overflow:hidden;
  color:var(--faint);text-align:right;pointer-events:none;z-index:1;
  border-right:1px solid var(--line);background:#091110;
}
#gutter i{display:block;font-style:normal;padding-right:9px}
#hl{overflow:hidden;pointer-events:none;z-index:2;color:var(--ink)}
#hl .ln{display:block;min-height:var(--lh)}
.edin{will-change:transform}
#hl .ln.cur{background:rgba(79,227,193,.11);box-shadow:inset 2px 0 0 var(--cyan)}
#hl .ln.err{background:rgba(255,107,94,.13);box-shadow:inset 2px 0 0 var(--warn)}
#code{
  z-index:3;background:transparent;color:transparent;caret-color:var(--cyan);
  resize:none;outline:none;overflow:auto;
}
#code::selection{background:rgba(79,227,193,.26)}
#code::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
#code::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#243330;border-radius:9px}
#code::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
.t-kw{color:var(--violet)}
.t-fn{color:var(--cyan)}
.t-const{color:var(--amber)}
.t-num{color:var(--ice)}
.t-str{color:#9be08a}
.t-cmt{color:var(--faint);font-style:italic}
.t-op{color:#8aa39d}

/* ---------- console ---------- */
#console{
  height:150px;flex:none;overflow-y:auto;background:#080f0e;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;line-height:1.65;padding:7px 12px;
}
#console div{display:flex;gap:9px;white-space:pre-wrap;word-break:break-word}
#console .n{color:#2f4340;flex:none;min-width:22px;text-align:right}
#console .out{color:#b8ccc6}
#console .sys{color:var(--faint)}
#console .good{color:var(--cyan)}
#console .bad{color:var(--warn)}

/* ---------- dish ---------- */
#res{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border-bottom:1px solid var(--line);flex:none;
}
.rc{background:var(--panel2);padding:7px 4px 8px;text-align:center}
.rc .k{
  font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:1px;
}
.rc .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.rc .pk{font-family:var(--mono);font-size:9px;color:#4a6b64;display:block;
  font-variant-numeric:tabular-nums;min-height:11px;letter-spacing:.02em}
.rc .rt{font-family:var(--mono);font-size:9.5px;color:var(--faint);display:block;
  font-variant-numeric:tabular-nums;margin-top:1px;min-height:12px}
.rc.locked{opacity:.3}
.rc.locked .v{color:var(--faint)}

#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:14px}
#dish{max-width:100%;max-height:100%;touch-action:none}
#status{
  flex:none;display:flex;gap:13px;flex-wrap:wrap;padding:6px 12px;
  border-top:1px solid var(--line);background:var(--panel2);
  font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
}
#status b{color:var(--ink);font-weight:500}

/* ---------- lab ---------- */
#pane-lab{background:var(--panel)}
.subtabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2);flex:none}
.subtabs button{
  flex:1;padding:8px 2px;font-size:10px;letter-spacing:.06em;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--disp);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
}
.subtabs button[aria-selected=true]{color:var(--cyan);border-bottom-color:var(--cyan)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:10px}

.grp{
  font-family:var(--disp);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);
}
.grp:first-child{margin-top:2px}
.node{
  width:100%;text-align:left;display:block;background:#0d1615;border:1px solid var(--line);
  border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.node:hover:not(:disabled){border-color:#3a534d;background:#122020}
.node:disabled{cursor:default}
.node .nm{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.02em;display:block}
.node .ds{font-size:11.5px;color:var(--dim);display:block;margin:2px 0 5px;line-height:1.4}
.node .cost{font-family:var(--mono);font-size:11px;display:flex;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.node.afford{border-color:#2f6b5d;background:#0e1c1a}
.node.afford .nm{color:var(--cyan)}
.node.poor{opacity:.72}
.node.poor .cost .short{color:var(--warn)}
.node.owned{opacity:.5;background:#0a1211}
.node.owned .nm{color:var(--dim)}
.node.owned .nm::after{content:" \2713";color:var(--ok)}
.node.owned .cost,.node.owned .ds{display:none}
.tcard{display:block;background:#0d1615;border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;margin-bottom:6px}
.tcard.live{border-color:var(--amber);background:#17150e}
.tcard.done{border-color:#2f6b5d}
.labsvg{display:block;margin:2px 0 4px;overflow:visible}
#labcard{position:sticky;bottom:-10px;background:var(--panel);padding-top:6px;
  margin-top:10px;border-top:1px solid var(--line)}
.labnode rect{transition:stroke .12s,fill .12s}
.labnode:hover rect{stroke:#d8e6e1}
.tcard .nm{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.02em;display:block}
.tcard .ds{font-size:11.5px;color:var(--dim);display:block;margin:2px 0 6px;line-height:1.4}
.tcard .cost{font-family:var(--mono);font-size:11px;display:flex;gap:9px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.tcard.done .nm{color:var(--cyan)}
.tcard.live .nm{color:var(--amber)}
.trow{display:flex;gap:7px;margin-top:8px}
.tbtn{
  font-family:var(--disp);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 12px;border-radius:3px;border:1px solid var(--line2);background:#141f1d;
  color:var(--ink);cursor:pointer;
}
.tbtn:hover{background:#1a2825;border-color:#3a534d}
.tbtn.go{background:var(--cyan);border-color:var(--cyan);color:#052019}
.tbtn.go:hover{background:#68efd0}
.tbtn.drop{border-color:#5c2f2c;color:#ff9c92;background:#1c1210}
.tbtn.drop:hover{background:#2a1714}

.api h4{
  font-family:var(--disp);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
  margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);
}
.api h4:first-child{margin-top:2px}
.api dl{margin:0}
.api dt{font-family:var(--mono);font-size:11.5px;color:var(--cyan);margin-top:9px}
.api dt.lk{color:var(--faint)}
.api dd{margin:1px 0 0;font-size:11.5px;color:var(--dim);line-height:1.45}
.api dd code{font-family:var(--mono);color:#a9bdb8;font-size:11px}
.api .sp{display:flex;align-items:baseline;gap:7px;margin-top:10px}
.api .dot{width:9px;height:9px;border-radius:50%;flex:none;position:relative;top:1px}
.api .sn{font-family:var(--mono);font-size:11.5px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;
  background:#13201e;border:1px solid var(--cyan);border-radius:4px;padding:9px 16px;
  font-family:var(--disp);font-size:12.5px;letter-spacing:.05em;color:var(--cyan);
  box-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:none;
  animation:tin .25s ease-out;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:900px){
  body{overflow:hidden}
  #tabs{display:flex}
  main{grid-template-columns:1fr;gap:0}
  main>section{display:none}
  main>section.on{display:flex}
  #console{height:118px}
  header{gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .brand{width:100%;margin-right:0}
  .speed input[type=range]{width:74px}
}
</style>

<div id="app">
  <header>
    <div class="brand">
      <h1>Petri Automaton</h1>
      <span class="sub">// nanobot culture lab</span>
    </div>
    <div class="ctl">
      <button class="btn run" id="bRun">Run</button>
      <button class="btn stop" id="bStop" disabled>Stop</button>
      <button class="btn" id="bStep">Step</button>
    </div>
    <label class="speed">SPD
      <input type="range" id="spd" min="0" max="11" step="1" value="3" aria-label="Execution speed">
      <span id="spdv">8/s</span>
    </label>
    <label class="chk"><input type="checkbox" id="rep" checked> repeat</label>
  </header>

  <div id="tabs" role="tablist">
    <button role="tab" data-p="pane-code" aria-selected="true">Code</button>
    <button role="tab" data-p="pane-dish" aria-selected="false">Dish</button>
    <button role="tab" data-p="pane-lab" aria-selected="false">Lab</button>
  </div>

  <main>
    <section id="pane-code" class="on">
      <div class="ph">
        Program
        <span class="spacer"></span>
        <span id="notrace" hidden style="font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);text-transform:none">too fast to trace</span>
        <button class="tiny" id="bApply" hidden>apply changes</button>
        <label class="chk" style="font-size:10px" title="re-apply the program automatically a moment after you stop typing"><input type="checkbox" id="live" checked> live</label>
        <button class="tiny" id="bBoard">reset dish</button>
        <button class="tiny" id="bClear">clear log</button>
        <button class="tiny" id="bReset">reset save</button>
      </div>
      <div id="slotbar">
        <select id="slotSel" aria-label="Saved programs"></select>
        <input id="slotName" type="text" maxlength="24" aria-label="Name of this program" placeholder="name">
        <button class="tiny" id="slotNew">+ new</button>
        <button class="tiny" id="slotDel">delete</button>
      </div>
      <div id="ed">
        <div id="gutter"></div>
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Program source code"></textarea>
      </div>
      <div id="console" aria-live="polite"></div>
    </section>

    <section id="pane-dish">
      <div id="res"></div>
      <div id="stage"><canvas id="dish"></canvas></div>
      <div id="status"></div>
    </section>

    <section id="pane-lab">
      <div class="subtabs">
        <button data-s="lab" aria-selected="true">Lab</button>
        <button data-s="trials" aria-selected="false">Tasks</button>
        <button data-s="prof" aria-selected="false">Profile</button>
        <button data-s="api" aria-selected="false">Docs</button>
      </div>
      <div class="scroll" id="labpane"></div>
      <div class="scroll" id="trialpane" hidden></div>
      <div class="scroll" id="profpane" hidden></div>
      <div class="scroll api" id="apipane" hidden></div>
    </section>
  </main>
</div>

<script>
/* ============================================================
   PETRI AUTOMATON - engine
   tokenizer -> parser -> resumable evaluator -> world -> render
   ============================================================ */
(function(){
"use strict";

/* ---------- errors ---------- */
class LangError extends Error{
  constructor(msg,line){ super(msg); this.line=line||0; }
}

/* ---------- tokenizer ---------- */
const KEYWORDS=new Set(['if','elif','else','while','for','in','def','return','break','continue',
  'pass','and','or','not','True','False','None','lambda','is','global',
  'try','except','finally','raise','as']);
const OPS3=['//=','**='];
const OPS2=['**','//','==','!=','<=','>=','+=','-=','*=','/=','%='];
const OPS1='+-*/%<>=(),:[]{}.;';

function readString(line,i,ln){
  const q=line[i];
  let j=i+1, raw='', val='';
  while(j<line.length&&line[j]!==q){
    if(line[j]==='\\'&&j+1<line.length){
      const n=line[j+1];
      raw+=line[j]+n;
      val+= n==='n'?'\n':n==='t'?'\t':n==='r'?'\r':n==='0'?'\0':n;
      j+=2;
    } else { raw+=line[j]; val+=line[j]; j++; }
  }
  if(j>=line.length) throw new LangError('SyntaxError: unterminated string literal',ln);
  return {raw,val,end:j+1};
}

/* f"...{expr:spec}..." -> [{lit}|{src,spec}] */
function splitFString(raw,ln){
  const parts=[]; let lit='';
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(c==='{'){
      if(raw[i+1]==='{'){ lit+='{'; i++; continue; }
      if(lit){ parts.push({lit}); lit=''; }
      let depth=1, j=i+1, q=null, src='';
      while(j<raw.length){
        const d=raw[j];
        if(q){ if(d==='\\'){ src+=d+(raw[j+1]||''); j+=2; continue; } if(d===q) q=null; src+=d; j++; continue; }
        if(d==='"'||d==="'"){ q=d; src+=d; j++; continue; }
        if('([{'.indexOf(d)>=0) depth++;
        else if(')]}'.indexOf(d)>=0){ depth--; if(depth===0) break; }
        src+=d; j++;
      }
      if(depth!==0) throw new LangError("SyntaxError: f-string: expecting '}'",ln);
      let spec=null, dd=0, qq=null, cut=-1;
      for(let k=0;k<src.length;k++){
        const d=src[k];
        if(qq){ if(d===qq) qq=null; continue; }
        if(d==='"'||d==="'"){ qq=d; continue; }
        if('([{'.indexOf(d)>=0) dd++;
        else if(')]}'.indexOf(d)>=0) dd--;
        else if(d===':'&&dd===0) cut=k;
      }
      if(cut>=0){ spec=src.slice(cut+1); src=src.slice(0,cut); }
      let conv=null;
      const cm=/^([\s\S]*)!([rsa])$/.exec(src);
      if(cm){ src=cm[1]; conv=cm[2]; }
      if(!src.trim()) throw new LangError('SyntaxError: f-string: valid expression required before “}”',ln);
      parts.push({src,spec,conv});
      i=j; continue;
    }
    if(c==='}'){
      if(raw[i+1]==='}'){ lit+='}'; i++; continue; }
      throw new LangError("SyntaxError: f-string: single '}' is not allowed",ln);
    }
    if(c==='\\'&&i+1<raw.length){
      const n=raw[i+1];
      lit+= n==='n'?'\n':n==='t'?'\t':n; i++; continue;
    }
    lit+=c;
  }
  if(lit) parts.push({lit});
  return parts;
}

function tokenize(src){
  const lines=src.split('\n'), toks=[], indents=[0];
  let depth=0;
  const push=(t,v,line)=>toks.push({t,v,line});
  for(let li=0;li<lines.length;li++){
    const line=lines[li], ln=li+1;
    let i=0;
    if(depth===0){
      let col=0;
      while(i<line.length&&(line[i]===' '||line[i]==='\t')){ col+=line[i]==='\t'?4:1; i++; }
      const rest=line.slice(i);
      if(rest===''||rest[0]==='#') continue;
      const top=indents[indents.length-1];
      if(col>top){ indents.push(col); push('indent',null,ln); }
      else if(col<top){
        while(indents.length>1&&col<indents[indents.length-1]){ indents.pop(); push('dedent',null,ln); }
        if(indents[indents.length-1]!==col)
          throw new LangError('IndentationError: unindent does not match any outer indentation level',ln);
      }
    }
    let had=false;
    while(i<line.length){
      const c=line[i];
      if(c===' '||c==='\t'){ i++; continue; }
      if(c==='#') break;
      had=true;
      /* string, possibly f-prefixed */
      if((c==='f'||c==='F')&&(line[i+1]==='"'||line[i+1]==="'")){
        const s=readString(line,i+1,ln);
        push('fstr',splitFString(s.raw,ln),ln); i=s.end; continue;
      }
      if(c==='"'||c==="'"){
        const s=readString(line,i,ln);
        push('str',s.val,ln); i=s.end; continue;
      }
      if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(line[i+1]||''))){
        let j=i;
        while(j<line.length&&/[0-9_]/.test(line[j])) j++;
        if(line[j]==='.'&&/[0-9]/.test(line[j+1]||'')){ j++; while(j<line.length&&/[0-9_]/.test(line[j])) j++; }
        else if(line[j]==='.'&&!/[A-Za-z_]/.test(line[j+1]||'')) j++;
        if(line[j]==='e'||line[j]==='E'){
          let k=j+1; if(line[k]==='+'||line[k]==='-') k++;
          if(/[0-9]/.test(line[k]||'')){ j=k; while(j<line.length&&/[0-9]/.test(line[j])) j++; }
        }
        push('num',parseFloat(line.slice(i,j).replace(/_/g,'')),ln); i=j; continue;
      }
      if(/[A-Za-z_]/.test(c)){
        let j=i; while(j<line.length&&/[A-Za-z0-9_]/.test(line[j])) j++;
        const w=line.slice(i,j);
        push(KEYWORDS.has(w)?'kw':'name',w,ln); i=j; continue;
      }
      const three=line.substr(i,3), two=line.substr(i,2);
      if(OPS3.indexOf(three)>=0){ push('op',three,ln); i+=3; continue; }
      if(OPS2.indexOf(two)>=0){ push('op',two,ln); i+=2; continue; }
      if(OPS1.indexOf(c)>=0){
        if('([{'.indexOf(c)>=0) depth++;
        if(')]}'.indexOf(c)>=0) depth=Math.max(0,depth-1);
        push('op',c,ln); i++; continue;
      }
      throw new LangError('SyntaxError: invalid character “'+c+'”',ln);
    }
    if(depth===0&&had) push('newline',null,ln);
  }
  const last=Math.max(1,lines.length);
  if(toks.length&&toks[toks.length-1].t!=='newline') push('newline',null,last);
  while(indents.length>1){ indents.pop(); push('dedent',null,last); }
  push('eof',null,last);
  return toks;
}

function describe(tk){
  if(tk.t==='eof') return 'end of file';
  if(tk.t==='newline') return 'end of line';
  if(tk.t==='indent') return 'an indent';
  if(tk.t==='dedent') return 'an unindent';
  if(tk.t==='str'||tk.t==='fstr') return 'a string';
  return '“'+tk.v+'”';
}

/* ---------- parser ---------- */
const FEATURE_LABEL={
  loop:'while loops', vars:'variables', cond:'if / else',
  forloop:'for loops', func:'functions', lists:'lists', dicts:'dictionaries',
  slicing:'slices', comprehensions:'comprehensions', higher:'lambdas',
  errors:'try / except blocks'
};
const COMP_OPS=['<','>','==','>=','<=','!='];
/* things real Python has that this interpreter deliberately does not; caught at
   statement level so they report themselves instead of a puzzling syntax error */
const UNSUPPORTED={
  'class':'classes', 'import':'imports', 'from':'imports',
  'with':'with blocks', 'yield':'generators',
  'assert':'assert statements', 'del':'del statements', 'nonlocal':'nonlocal declarations',
  'async':'async functions', 'await':'await expressions'
};

class Parser{
  constructor(toks,unlocked){ this.t=toks; this.i=0; this.u=unlocked||new Set(); }
  peek(k){ return this.t[this.i+(k||0)]; }
  get line(){ return this.peek().line; }
  at(t,v){ const x=this.peek(); return x.t===t&&(v===undefined||x.v===v); }
  eat(t,v){ return this.at(t,v)?this.t[this.i++]:null; }
  expect(t,v,what){
    const x=this.eat(t,v);
    if(!x) throw new LangError('SyntaxError: expected '+(what||'“'+v+'”')+', found '+describe(this.peek()),this.peek().line);
    return x;
  }
  need(f){
    if(!this.u.has(f))
      throw new LangError(FEATURE_LABEL[f]+' are locked — unlock them in the Lab panel',this.peek().line);
  }

  program(){
    const body=[];
    while(!this.at('eof')){
      if(this.eat('newline')) continue;
      if(this.at('indent')) throw new LangError('IndentationError: unexpected indent',this.line);
      body.push(this.statement());
    }
    return body;
  }
  block(){
    if(this.eat('newline')){
      this.expect('indent',undefined,'an indented block');
      const body=[];
      while(!this.at('dedent')&&!this.at('eof')){
        if(this.eat('newline')) continue;
        body.push(this.statement());
      }
      this.expect('dedent',undefined,'the end of the indented block');
      if(!body.length) throw new LangError('IndentationError: expected an indented block',this.line);
      return body;
    }
    return this.simpleLine();
  }
  statement(){
    const tk=this.peek();
    if(tk.t==='name'&&UNSUPPORTED[tk.v]){
      // only if it opens a statement - a variable happening to be called "with" is fine
      const nx=this.peek(1);
      const opens = nx.t==='name'||nx.t==='str'||nx.t==='num'||nx.t==='fstr'||nx.t==='newline'||
                    (nx.t==='op'&&(nx.v===':'||nx.v==='*'));
      if(opens)
        throw new LangError('SyntaxError: '+UNSUPPORTED[tk.v]+' are not supported in this game’s Python',tk.line);
    }
    if(tk.t==='kw'){
      if(tk.v==='if'){ this.need('cond'); return this.ifStmt('if'); }
      if(tk.v==='while'){ this.need('loop'); return this.whileStmt(); }
      if(tk.v==='for'){ this.need('forloop'); return this.forStmt(); }
      if(tk.v==='def'){ this.need('func'); return this.defStmt(); }
      if(tk.v==='try'){ this.need('errors'); return this.tryStmt(); }
      if(tk.v==='raise'){ this.need('errors'); return this.raiseStmt(); }
      if(tk.v==='except'||tk.v==='finally')
        throw new LangError('SyntaxError: \u201c'+tk.v+'\u201d has no matching \u201ctry\u201d at this indentation',tk.line);
      if(tk.v==='elif'||tk.v==='else')
        throw new LangError('SyntaxError: “'+tk.v+'” does not match any “if” at this indentation',tk.line);
    }
    const list=this.simpleLine();
    return list.length===1?list[0]:{k:'seq',body:list,line:tk.line};
  }
  /* one logical line of small statements separated by ';' */
  simpleLine(){
    const list=[this.simple()];
    while(this.eat('op',';')){
      if(this.at('newline')) break;
      list.push(this.simple());
    }
    this.expect('newline',undefined,'end of line');
    return list;
  }
  ifStmt(kw){
    const line=this.line; this.expect('kw',kw);
    const test=this.expr(); this.expect('op',':');
    const body=this.block();
    let orelse=[];
    if(this.at('kw','elif')) orelse=[this.ifStmt('elif')];
    else if(this.eat('kw','else')){ this.expect('op',':'); orelse=this.block(); }
    return {k:'if',test,body,orelse,line};
  }
  whileStmt(){
    const line=this.line; this.expect('kw','while');
    const test=this.expr(); this.expect('op',':');
    const body=this.block();
    let orelse=[];
    if(this.eat('kw','else')){ this.expect('op',':'); orelse=this.block(); }
    return {k:'while',test,body,orelse,line};
  }
  forStmt(){
    const line=this.line; this.expect('kw','for');
    const target=this.targetList();
    this.expect('kw','in',' “in”');
    const iter=this.exprList();
    this.expect('op',':');
    const body=this.block();
    let orelse=[];
    if(this.eat('kw','else')){ this.expect('op',':'); orelse=this.block(); }
    return {k:'for',target,iter,body,orelse,line};
  }
  tryStmt(){
    const line=this.line; this.expect('kw','try'); this.expect('op',':');
    const body=this.block();
    const handlers=[];
    let orelse=[], fin=[];
    while(this.at('kw','except')){
      const hl=this.line; this.eat('kw');
      let type=null, name=null;
      if(!this.at('op',':')){
        type=this.expect('name',undefined,'an exception name').v;
        if(this.eat('kw','as')) name=this.expect('name',undefined,'a name').v;
      }
      this.expect('op',':');
      handlers.push({type,name,body:this.block(),line:hl});
    }
    if(this.eat('kw','else')){ this.expect('op',':'); orelse=this.block(); }
    if(this.eat('kw','finally')){ this.expect('op',':'); fin=this.block(); }
    if(!handlers.length&&!fin.length)
      throw new LangError('SyntaxError: this \u201ctry\u201d needs an \u201cexcept\u201d or a \u201cfinally\u201d',line);
    return {k:'try',body,handlers,orelse,fin,line};
  }
  raiseStmt(){
    const line=this.line; this.expect('kw','raise');
    if(this.at('newline')||this.at('op',';')) return {k:'raise',exc:null,line};
    return {k:'raise',exc:this.expr(),line};
  }
  defStmt(){
    const line=this.line; this.expect('kw','def');
    const name=this.expect('name',undefined,'a function name').v;
    this.expect('op','(');
    const params=this.paramList();
    this.expect('op',')'); this.expect('op',':');
    return {k:'def',name,params,body:this.block(),line};
  }
  paramList(){
    const params=[]; let seenDefault=false;
    if(!this.at('op',')')){
      do{
        if(this.at('op',')')) break;
        if(this.at('op','*'))
          throw new LangError('SyntaxError: *args and **kwargs are not supported',this.line);
        const nm=this.expect('name',undefined,'a parameter name').v;
        let def=null;
        if(this.eat('op','=')){ def=this.expr(); seenDefault=true; }
        else if(seenDefault)
          throw new LangError('SyntaxError: parameter without a default follows one with a default',this.line);
        params.push({name:nm,def});
      }while(this.eat('op',','));
    }
    return params;
  }
  targetList(){
    const first=this.target();
    if(!this.at('op',',')) return first;
    const items=[first];
    while(this.eat('op',',')){
      if(this.at('kw','in')||this.at('op','=')) break;
      items.push(this.target());
    }
    return {k:'tuple',items,line:first.line};
  }
  target(){
    const e=this.postfixExpr();
    this.checkTarget(e);
    return e;
  }
  checkTarget(e){
    if(e.k==='name'||e.k==='index') return;
    if(e.k==='slice')
      throw new LangError('SyntaxError: assigning to a slice is not supported — assign one index at a time',e.line);
    if(e.k==='tuple'||e.k==='listlit'){ e.items.forEach(x=>this.checkTarget(x)); return; }
    throw new LangError('SyntaxError: cannot assign to this expression',e.line);
  }

  simple(){
    const line=this.line;
    if(this.at('kw','return')){
      this.eat('kw');
      const v=(this.at('newline')||this.at('op',';'))?null:this.exprList();
      return {k:'return',value:v,line};
    }
    if(this.eat('kw','break')) return {k:'break',line};
    if(this.eat('kw','continue')) return {k:'continue',line};
    if(this.eat('kw','pass')) return {k:'pass',line};
    if(this.at('kw','global')){
      this.eat('kw');
      const names=[this.expect('name',undefined,'a name').v];
      while(this.eat('op',',')) names.push(this.expect('name',undefined,'a name').v);
      return {k:'global',names,line};
    }
    const e=this.exprList();
    /* chained assignment: a = b = value */
    if(this.at('op','=')){
      this.need('vars');
      const targets=[e];
      let value=null;
      while(this.eat('op','=')){
        const nxt=this.exprList();
        targets.push(nxt);
      }
      value=targets.pop();
      targets.forEach(t=>this.checkTarget(t));
      return {k:'assign',targets,value,line};
    }
    const AUG=['+=','-=','*=','/=','//=','%=','**='];
    for(let a=0;a<AUG.length;a++){
      if(this.at('op',AUG[a])){
        this.need('vars'); this.eat('op');
        const v=this.exprList();
        this.checkTarget(e);
        if(e.k==='tuple') throw new LangError('SyntaxError: illegal target for augmented assignment',line);
        return {k:'augassign',target:e,op:AUG[a].slice(0,-1),value:v,line};
      }
    }
    return {k:'expr',value:e,line};
  }

  /* comma-separated -> tuple */
  exprList(){
    const first=this.expr();
    if(!this.at('op',',')) return first;
    const items=[first];
    let trailing=false;
    while(this.eat('op',',')){
      if(this.at('newline')||this.at('op','=')||this.at('op',')')||this.at('op',']')||
         this.at('op','}')||this.at('op',':')||this.at('op',';')||this.at('eof')){ trailing=true; break; }
      items.push(this.expr());
    }
    void trailing;
    return {k:'tuple',items,line:first.line};
  }

  /* test: ternary / lambda */
  expr(){
    if(this.at('kw','lambda')) return this.lambdaExpr();
    const v=this.orExpr();
    if(this.at('kw','if')){
      this.need('cond');
      const line=this.line; this.eat('kw');
      const cond=this.orExpr();
      this.expect('kw','else',' “else”');
      const other=this.expr();
      return {k:'ifexp',body:v,test:cond,orelse:other,line};
    }
    return v;
  }
  lambdaExpr(){
    this.need('higher');
    const line=this.line; this.expect('kw','lambda');
    const params=[];
    if(!this.at('op',':')){
      do{
        if(this.at('op',':')) break;
        const nm=this.expect('name',undefined,'a parameter name').v;
        let def=null;
        if(this.eat('op','=')) def=this.expr();
        params.push({name:nm,def});
      }while(this.eat('op',','));
    }
    this.expect('op',':');
    return {k:'lambda',params,body:this.expr(),line};
  }
  orExpr(){
    let l=this.andExpr();
    while(this.at('kw','or')){ const line=this.line; this.eat('kw'); l={k:'logic',op:'or',l,r:this.andExpr(),line}; }
    return l;
  }
  andExpr(){
    let l=this.notExpr();
    while(this.at('kw','and')){ const line=this.line; this.eat('kw'); l={k:'logic',op:'and',l,r:this.notExpr(),line}; }
    return l;
  }
  notExpr(){
    if(this.at('kw','not')){ const line=this.line; this.eat('kw'); return {k:'not',v:this.notExpr(),line}; }
    return this.comparison();
  }
  comparison(){
    const first=this.arith();
    const rest=[];
    while(true){
      const tk=this.peek();
      let op=null;
      if(tk.t==='op'&&COMP_OPS.indexOf(tk.v)>=0){ op=tk.v; this.i++; }
      else if(tk.t==='kw'&&tk.v==='in'){ op='in'; this.i++; }
      else if(tk.t==='kw'&&tk.v==='not'&&this.peek(1).t==='kw'&&this.peek(1).v==='in'){ op='not in'; this.i+=2; }
      else if(tk.t==='kw'&&tk.v==='is'){
        this.i++;
        if(this.at('kw','not')){ this.eat('kw'); op='is not'; } else op='is';
      }
      else break;
      rest.push([op,this.arith(),tk.line]);
    }
    if(!rest.length) return first;
    return {k:'chain',first,rest,line:first.line};
  }
  arith(){
    let l=this.term();
    while(this.at('op','+')||this.at('op','-')){
      const tk=this.peek(); this.i++;
      l={k:'bin',op:tk.v,l,r:this.term(),line:tk.line};
    }
    return l;
  }
  term(){
    let l=this.factor();
    while(this.at('op','*')||this.at('op','/')||this.at('op','//')||this.at('op','%')){
      const tk=this.peek(); this.i++;
      l={k:'bin',op:tk.v,l,r:this.factor(),line:tk.line};
    }
    return l;
  }
  factor(){
    if(this.at('op','-')||this.at('op','+')){
      const tk=this.peek(); this.i++;
      return {k:'unary',op:tk.v,v:this.factor(),line:tk.line};
    }
    return this.power();
  }
  power(){
    const b=this.postfixExpr();
    if(this.at('op','**')){ const tk=this.peek(); this.i++; return {k:'bin',op:'**',l:b,r:this.factor(),line:tk.line}; }
    return b;
  }
  postfixExpr(){
    let e=this.atom();
    while(true){
      if(this.at('op','(')){
        const line=this.line; this.eat('op');
        const call=this.argList();
        this.expect('op',')');
        e={k:'call',fn:e,args:call.args,kw:call.kw,line};
      } else if(this.at('op','[')){
        this.need('lists');
        const line=this.line; this.eat('op');
        e=this.subscript(e,line);
      } else if(this.at('op','.')){
        const line=this.line; this.eat('op');
        const nm=this.expect('name',undefined,'an attribute name').v;
        e={k:'attr',obj:e,name:nm,line};
      } else break;
    }
    return e;
  }
  subscript(obj,line){
    let lo=null, hi=null, st=null, isSlice=false;
    if(!this.at('op',':')) lo=this.expr();
    if(this.at('op',':')){
      isSlice=true; this.eat('op');
      if(!this.at('op',':')&&!this.at('op',']')) hi=this.expr();
      if(this.eat('op',':')){ if(!this.at('op',']')) st=this.expr(); }
    }
    this.expect('op',']');
    if(isSlice) this.need('slicing');
    return isSlice?{k:'slice',obj,lo,hi,st,line}:{k:'index',obj,index:lo,line};
  }
  argList(){
    const args=[], kw=[];
    if(!this.at('op',')')){
      do{
        if(this.at('op',')')) break;
        if(this.peek().t==='name'&&this.peek(1).t==='op'&&this.peek(1).v==='='){
          const nm=this.eat('name').v; this.eat('op','=');
          kw.push([nm,this.expr()]);
        } else {
          if(kw.length) throw new LangError('SyntaxError: positional argument follows keyword argument',this.line);
          args.push(this.expr());
        }
      }while(this.eat('op',','));
    }
    return {args,kw};
  }
  /* [a, b] / [e for x in it if c] */
  comprehensionTail(){
    const loops=[];
    while(this.at('kw','for')){
      this.need('forloop'); this.need('comprehensions');
      this.eat('kw');
      const target=this.targetList();
      this.expect('kw','in',' “in”');
      const iter=this.orExpr();
      const ifs=[];
      while(this.at('kw','if')){ this.eat('kw'); ifs.push(this.orExpr()); }
      loops.push({target,iter,ifs});
    }
    return loops;
  }
  atom(){
    const tk=this.peek(), line=tk.line;
    if(tk.t==='op'&&tk.v==='*')
      throw new LangError('SyntaxError: starred unpacking (a, *rest = ...) is not supported',line);
    if(tk.t==='num'){ this.i++; return {k:'lit',v:tk.v,line}; }
    if(tk.t==='str'){
      this.i++;
      let s=tk.v;
      while(this.at('str')) s+=this.eat('str').v;      // implicit concatenation
      return {k:'lit',v:s,line};
    }
    if(tk.t==='fstr'){
      this.i++;
      const parts=tk.v.map(p=>{
        if(p.lit!==undefined) return {lit:p.lit};
        const sub=new Parser(tokenize(p.src),this.u);
        const node=sub.exprList();
        if(!sub.at('newline')&&!sub.at('eof'))
          throw new LangError('SyntaxError: invalid expression in f-string',line);
        return {node,spec:p.spec,conv:p.conv};
      });
      return {k:'fstr',parts,line};
    }
    if(tk.t==='kw'){
      if(tk.v==='True'){ this.i++; return {k:'lit',v:true,line}; }
      if(tk.v==='False'){ this.i++; return {k:'lit',v:false,line}; }
      if(tk.v==='None'){ this.i++; return {k:'lit',v:null,line}; }
      if(tk.v==='lambda') return this.lambdaExpr();
    }
    if(tk.t==='name'){ this.i++; return {k:'name',name:tk.v,line}; }
    if(this.at('op','(')){
      this.eat('op');
      if(this.at('op',')')){ this.eat('op'); return {k:'tuple',items:[],line}; }
      const first=this.expr();
      if(this.at('op',':'))
        throw new LangError('SyntaxError: the walrus operator := is not supported',line);
      if(this.at('kw','for'))
        throw new LangError('SyntaxError: generator expressions are not supported — '+
          'use a list comprehension [ x for x in ... ] instead',line);
      if(this.at('op',',')){
        const items=[first];
        while(this.eat('op',',')){
          if(this.at('op',')')) break;
          items.push(this.expr());
        }
        this.expect('op',')');
        return {k:'tuple',items,line};
      }
      this.expect('op',')');
      return first;
    }
    if(this.at('op','[')){
      this.need('lists');
      this.eat('op');
      if(this.at('op',']')){ this.eat('op'); return {k:'listlit',items:[],line}; }
      const first=this.expr();
      if(this.at('kw','for')){
        const loops=this.comprehensionTail();
        this.expect('op',']');
        return {k:'comp',kind:'list',elt:first,loops,line};
      }
      const items=[first];
      while(this.eat('op',',')){
        if(this.at('op',']')) break;
        items.push(this.expr());
      }
      this.expect('op',']');
      return {k:'listlit',items,line};
    }
    if(this.at('op','{')){
      this.need('dicts');
      this.eat('op');
      if(this.at('op','}')){ this.eat('op'); return {k:'dictlit',pairs:[],line}; }
      const k1=this.expr();
      if(this.at('op',',')||this.at('op','}'))
        throw new LangError('SyntaxError: set literals are not supported — use a list [ ] or a dict { key: value }',line);
      this.expect('op',':');
      const v1=this.expr();
      if(this.at('kw','for')){
        const loops=this.comprehensionTail();
        this.expect('op','}');
        return {k:'comp',kind:'dict',key:k1,val:v1,loops,line};
      }
      const pairs=[[k1,v1]];
      while(this.eat('op',',')){
        if(this.at('op','}')) break;
        const kk=this.expr(); this.expect('op',':');
        pairs.push([kk,this.expr()]);
      }
      this.expect('op','}');
      return {k:'dictlit',pairs,line};
    }
    throw new LangError('SyntaxError: invalid syntax near '+describe(tk),line);
  }
}

/* ---------- values ---------- */
class Tup extends Array{}
/* Python hashes by value: (1,2) is the same key as another (1,2). A JS Map
   hashes objects by identity, so tuple keys silently never matched. This keeps
   a canonical string per key and stores the original key beside the value. */
class PyDict{
  constructor(src){
    this.m=new Map();
    const self=this;
    if(src) src.forEach(function(v,k){ self.set(k,v); });
  }
  static ck(k){
    if(k===null) return 'N';
    if(k===true) return 'T';
    if(k===false) return 'F';
    const t=typeof k;
    if(t==='number') return '#'+k;
    if(t==='string') return '$'+k;
    if(Array.isArray(k)) return '('+Array.prototype.map.call(k,PyDict.ck).join(',')+')';
    return '@'+String(k);
  }
  get size(){ return this.m.size; }
  has(k){ return this.m.has(PyDict.ck(k)); }
  get(k){ const e=this.m.get(PyDict.ck(k)); return e?e[1]:undefined; }
  set(k,v){ this.m.set(PyDict.ck(k),[k,v]); return this; }
  delete(k){ return this.m.delete(PyDict.ck(k)); }
  clear(){ this.m.clear(); }
  forEach(fn,thisArg){ this.m.forEach(function(e){ fn.call(thisArg,e[1],e[0]); }); }
  keys(){ const o=[]; this.m.forEach(function(e){ o.push(e[0]); }); return o; }
  values(){ const o=[]; this.m.forEach(function(e){ o.push(e[1]); }); return o; }
}
/* dict.keys()/values()/items() are views in Python: iterable, printed as
   dict_keys([...]), and not subscriptable */
class View extends Array{}
function mkTuple(arr){ const t=new Tup(); for(let i=0;i<arr.length;i++) t.push(arr[i]); return t; }
function mkView(name,arr){ const v=new View(); v.__view=name; for(let i=0;i<arr.length;i++) v.push(arr[i]); return v; }
function isTuple(v){ return v instanceof Tup; }
function isList(v){ return Array.isArray(v)&&!(v instanceof Tup)&&!(v instanceof View); }

function typeName(v){
  if(v===null) return 'NoneType';
  if(v===true||v===false) return 'bool';
  if(typeof v==='number') return Number.isInteger(v)?'int':'float';
  if(typeof v==='string') return 'str';
  if(v instanceof View) return v.__view;
  if(isTuple(v)) return 'tuple';
  if(Array.isArray(v)) return 'list';
  if(v instanceof PyDict) return 'dict';
  if(v&&(v.__fn||v.__pure||v.__act||v.__gen||v.__bound)) return 'function';
  return 'object';
}
function truthy(v){
  if(v===null||v===false) return false;
  if(v===true) return true;
  if(typeof v==='number') return v!==0;
  if(typeof v==='string') return v.length>0;
  if(Array.isArray(v)) return v.length>0;
  if(v instanceof PyDict) return v.size>0;
  return true;
}
function numStr(n){
  if(Number.isInteger(n)) return String(n);
  if(isNaN(n)) return 'nan';
  if(!isFinite(n)) return n>0?'inf':'-inf';
  return String(n);   // JS and Python both print the shortest round-trip form
}
function fmt(v){
  if(v===null) return 'None';
  if(v===true) return 'True';
  if(v===false) return 'False';
  if(typeof v==='number') return numStr(v);
  if(typeof v==='string') return v;
  const items=a=>Array.prototype.map.call(a,rep).join(', ');
  if(v instanceof View) return v.__view+'(['+items(v)+'])';
  if(isTuple(v)) return v.length===1?'('+rep(v[0])+',)':'('+items(v)+')';
  if(Array.isArray(v)) return '['+items(v)+']';
  if(v instanceof PyDict){ const o=[]; v.forEach((val,k)=>o.push(rep(k)+': '+rep(val))); return '{'+o.join(', ')+'}'; }
  if(v&&v.__fn) return '<function '+(v.__fn.name||'<lambda>')+'>';
  if(v&&(v.__pure||v.__act||v.__gen)) return '<built-in function>';
  if(v&&v.__bound) return '<built-in method '+v.__bound.name+'>';
  return '<object>';
}
function rep(v){
  if(typeof v==='string') return "'"+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  return fmt(v);
}
function pyEq(a,b){
  if(a===b) return true;
  if(a===null||b===null) return false;
  if(typeof a==='boolean'||typeof b==='boolean'){
    if(typeof a==='number'||typeof b==='number') return (a?1:a===false?0:a)===(b?1:b===false?0:b);
  }
  if(typeof a==='number'&&typeof b==='number') return a===b;
  if(Array.isArray(a)&&Array.isArray(b)){
    if(isTuple(a)!==isTuple(b)) return false;
    if(a.length!==b.length) return false;
    for(let i=0;i<a.length;i++) if(!pyEq(a[i],b[i])) return false;
    return true;
  }
  if(a instanceof PyDict&&b instanceof PyDict){
    if(a.size!==b.size) return false;
    let ok=true;
    a.forEach((v,k)=>{ if(!ok) return; if(!b.has(k)||!pyEq(v,b.get(k))) ok=false; });
    return ok;
  }
  return false;
}
function pyCmp(a,b,line){
  if(typeof a==='number'&&typeof b==='number') return a<b?-1:a>b?1:0;
  if(typeof a==='string'&&typeof b==='string') return a<b?-1:a>b?1:0;
  if(Array.isArray(a)&&Array.isArray(b)){
    const n=Math.min(a.length,b.length);
    for(let i=0;i<n;i++){ const c=pyCmp(a[i],b[i],line); if(c) return c; }
    return a.length-b.length===0?0:(a.length<b.length?-1:1);
  }
  throw new LangError("TypeError: '<' not supported between instances of '"+typeName(a)+"' and '"+typeName(b)+"'",line);
}
/* Python iteration order: dicts iterate their keys */
function iterate(v,line){
  if(Array.isArray(v)) return Array.from(v);   // plain array, never a Tup/View
  if(typeof v==='string') return v.split('');
  if(v instanceof PyDict) return Array.from(v.keys());
  throw new LangError("TypeError: '"+typeName(v)+"' object is not iterable",line);
}
function normIndex(i,len,line,what){
  if(typeof i!=='number'||!Number.isInteger(i))
    throw new LangError('TypeError: '+(what||'list')+' indices must be integers',line);
  let j=i<0?i+len:i;
  if(j<0||j>=len) throw new LangError('IndexError: '+(what||'list')+' index out of range',line);
  return j;
}
function pySlice(seq,lo,hi,st,line){
  const len=seq.length;
  let step=st===null||st===undefined?1:st;
  if(typeof step!=='number'||!Number.isInteger(step))
    throw new LangError('TypeError: slice indices must be integers',line);
  if(step===0) throw new LangError('ValueError: slice step cannot be zero',line);
  const clamp=(v,def)=>{
    if(v===null||v===undefined) return def;
    if(typeof v!=='number'||!Number.isInteger(v))
      throw new LangError('TypeError: slice indices must be integers',line);
    let x=v<0?v+len:v;
    return x;
  };
  let start,stop;
  if(step>0){
    start=Math.min(Math.max(clamp(lo,0),0),len);
    stop=Math.min(Math.max(clamp(hi,len),0),len);
  } else {
    start=Math.min(Math.max(clamp(lo,len-1),-1),len-1);
    stop=Math.min(Math.max(clamp(hi,-1),-1),len-1);
  }
  const out=[];
  if(step>0){ for(let i=start;i<stop;i+=step) out.push(seq[i]); }
  else { for(let i=start;i>stop;i+=step) out.push(seq[i]); }
  if(typeof seq==='string') return out.join('');
  return isTuple(seq)?mkTuple(out):out;
}
/* f-string format specs: the common ones only */
function applySpec(v,spec,line,conv){
  if(conv) v = conv==='s' ? fmt(v) : rep(v);
  if(!spec) return fmt(v);
  const m=/^([<>^])?(0)?(\d+)?(?:\.(\d+))?([dfs%])?$/.exec(spec);
  if(!m) throw new LangError('ValueError: unsupported format spec “'+spec+'”',line);
  const align=m[1], zero=!!m[2], width=m[3]?parseInt(m[3],10):0,
        prec=m[4]!==undefined?parseInt(m[4],10):null, kind=m[5];
  let s;
  if(kind==='f'){
    if(typeof v!=='number') throw new LangError("ValueError: cannot format '"+typeName(v)+"' as a float",line);
    s=v.toFixed(prec===null?6:prec);
  } else if(kind==='d'){
    if(typeof v!=='number') throw new LangError("ValueError: cannot format '"+typeName(v)+"' as an integer",line);
    s=String(Math.trunc(v));
  } else if(kind==='%'){
    s=(v*100).toFixed(prec===null?6:prec)+'%';
  } else {
    s=fmt(v);
    if(prec!==null) s=s.slice(0,prec);
  }
  if(width&&s.length<width){
    const padn=width-s.length;
    const isNum=typeof v==='number'&&!align;
    if(zero&&!align&&typeof v==='number'){
      // zeros go after the sign, so -5 with 04d is -005
      s=/^[-+]/.test(s) ? s[0]+'0'.repeat(padn)+s.slice(1) : '0'.repeat(padn)+s;
    }
    else if(align==='>'||(isNum&&!align)) s=' '.repeat(padn)+s;
    else if(align==='^') s=' '.repeat(Math.floor(padn/2))+s+' '.repeat(Math.ceil(padn/2));
    else s=s+' '.repeat(padn);
  }
  return s;
}

/* ---------- scopes ---------- */
class Env{
  constructor(parent){ this.v=new Map(); this.parent=parent||null; this.globalNames=null; }
  get(n,line){
    let e=this;
    while(e){ if(e.v.has(n)) return e.v.get(n); e=e.parent; }
    throw new LangError("NameError: name '"+n+"' is not defined",line);
  }
  has(n){ let e=this; while(e){ if(e.v.has(n)) return true; e=e.parent; } return false; }
  set(n,v){
    if(this.globalNames&&this.globalNames.has(n)){ GLOBALS.v.set(n,v); return; }
    this.v.set(n,v);
  }
  declareGlobal(n){
    if(!this.globalNames) this.globalNames=new Set();
    this.globalNames.add(n);
  }
}

   permanent, so one pass over the dish retired sterilize() for the rest of the
   run and substrate() with it. Now growing something in a treated cell dirties
   it, and the treatment has to be repeated - which is what makes substrate()
   worth a step and fast optics worth buying. */
const STERILE_CROPS=5;
/* Contamination.

   Ground you stop attending to goes bad, and bad ground infects what is beside
   it. This is the one mechanic that makes a dish you cannot keep up with an
   actively worse dish, rather than just a slower one - without it the best play
   on a big board is to work one corner and let the rest sit.

   Deterministic throughout, on purpose: a cell fouls a fixed number of steps
   after the bot last stood on it, and a fouled cell takes its neighbours a fixed
   number of steps later. That makes it a scheduling problem you solve by
   writing a patrol, not a dice roll you absorb. */
const FOUL_PER_CELL=12;   // the neglect window, in steps per cell of the dish
const FOUL_SPREAD=260;    // steps a fouled cell waits before taking a neighbour
const FOUL_CHECK=20;      // how often the dish is examined; keeps the scan cheap
/* Scaled by area, not fixed. A worst-case lap is about four steps a cell, so
   this is roughly three laps of slack at every dish size. A flat window was
   fine at 7x7 and fatal at 15x15, where one circuit of a 225-cell dish already
   runs to ~900 steps: the far side fouled while the bot was still working, seeds
   then failed on fouled ground, the lap got longer, and the whole dish died.
   The rule is meant to be "keep up with your own dish", and that has to mean the
   same thing on every dish. */
function foulNeglect(){ return W.size*W.size*FOUL_PER_CELL; }

   starts you with an empty ledger and bacteria is where you have to begin. */
const RES_FROM={bacteria:'CULTURE',spores:'SPORE',enzymes:'MYCELIUM',biomass:'BIOFILM',crystals:'CRYSTAL'};
/* every species you must be able to plant to reach sp from nothing, in order */
function supplyChain(sp){
  const out=[], seen=new Set();
  (function walk(s){
    if(!s||seen.has(s)) return;
    seen.add(s);
    const d=SPECIES[s];
    if(d.cost) for(const r in d.cost) walk(RES_FROM[r]);
    out.push(s);
  })(sp);
  return out;
}

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

const W={

/* W.x / W.y still mean "where the bot is" - they just resolve to whichever bot
   is currently executing, so every existing call site and test keeps working. */
['x','y','px','py'].forEach(function(k){
  Object.defineProperty(W,k,{
    get:function(){ return W.bots[W.bot][k]; },
    set:function(v){ W.bots[W.bot][k]=v; },
    enumerable:false, configurable:true
  });
});
function setBotCount(n){
  while(W.bots.length<n) W.bots.push({x:0,y:0,px:0,py:0});
  if(W.bots.length>n) W.bots.length=n;
  if(W.bot>=W.bots.length) W.bot=0;
}
function homeBots(){
  W.bots.forEach(function(b,i){
    b.x=Math.min(i,W.size-1); b.y=0; b.px=b.x; b.py=0;
  });
  W.bot=0;
}
function newCell(){ return {g:'agar',s:null,t:0,f:0,w:false,gt:0,sc:0,seen:0,ft:0}; }
function initGrid(n){
  W.size=n; W.grid=[];
  for(let i=0;i<n*n;i++) W.grid.push(newCell());
}
function resizeGrid(n){
  const old=W.grid, os=W.size;
  const g=[];
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    g.push(x<os&&y<os?old[y*os+x]:newCell());
  }
  W.size=n; W.grid=g;
  for(const c of g) if(!c.seen) c.seen=W.tick;
  W.x=Math.min(W.x,n-1); W.y=Math.min(W.y,n-1);
  W.px=W.x; W.py=W.y;
}
function cell(x,y){ return W.grid[y*W.size+x]; }
function here(){ return cell(W.x,W.y); }
/* a cell remembers its own growth time, because some species vary per planting */
function growTime(c){ return c.gt||SPECIES[c.s].grow; }
function rollGrow(sp){
  const d=SPECIES[sp];
  if(!d.growVar) return d.grow;
  return d.growVar[0]+Math.floor(RNG()*(d.growVar[1]-d.growVar[0]+1));
}
/* A ripe cell holds full value for `peak` steps, then its yield ramps down
   over `fade` steps, then it is gone. Evaluated lazily from the clock, so no
   per-cell timers are needed. */
function ripeAge(c){ return c.s===null?0:(W.tick-c.t-growTime(c)); }
function freshness(c){
  if(c.s===null) return 0;
  const d=SPECIES[c.s];
  if(!d.fade) return 1;
  const peak=d.peak*(W.feats.has('preserve')?1.5:1);
  const over=ripeAge(c)-peak;
  return over<=0?1:Math.max(0,1-over/d.fade);
}
/* The ramp bottoms out at a single unit rather than nothing: a late harvest
   still succeeds, so it never costs the doubled empty-grab step. Without that
   floor, one late lap lengthens the next one and the farm death-spirals. */
function yieldFor(c){
  const d=SPECIES[c.s];
  if(!d.base) return 0;
  return Math.max(1,Math.round(d.base*freshness(c)));
}
function isRotted(c){
  if(c.s===null) return false;

}
function occupied(c){ return c.s!==null && !isRotted(c); }
function foul(c,why){
  if(c.g==='fouled'||c.w) return false;
  /* nothing goes bad under a bot that is standing on it - spread reaching into
     the cell you are working right now reads as the game cheating */
  for(const b of W.bots) if(cell(b.x,b.y)===c) return false;
  c.g='fouled'; c.ft=W.tick; c.s=null; c.t=0; c.f=0; c.gt=0; c.sc=0;
  if(why) hintOnce('foul-'+why, why);
  return true;
}
/* Brings fouling up to date with the clock. Written as a catch-up rather than a
   per-tick callback so that missing a call only defers the work: any caller can
   ask for the current state and get it. */
let lastFoulScan=0;
function foulCatchUp(){
  /* Nothing goes bad before you can do anything about it. sterilize() is the only
     cure and it arrives with Sterile technique; without this gate, a player who
     worked one row of the opening 5x5 watched the other twenty cells foul, spread
     and take the dish, with no way to clean any of it. A mechanic whose answer you
     do not own yet is not difficulty, it is a dead end. */
  if(!W.feats.has('sterile')) return;
  if(W.maze||W.trial) return;               // not a farm; nothing to neglect
  /* the second half catches the clock jumping backwards, which it does when a
     stage or trial hands the real dish back */
  if(W.tick>=lastFoulScan&&W.tick-lastFoulScan<FOUL_CHECK) return;
  lastFoulScan=W.tick;
  const n=W.size, grid=W.grid, limit=foulNeglect();
  /* a bot is tending the ground it stands on whether or not it acted this tick */
  for(const b of W.bots){ const c=cell(b.x,b.y); if(c) c.seen=W.tick; }
  /* neglect first, then spread, so a cell cannot foul and infect in one pass */
  for(let i=0;i<grid.length;i++){
    const c=grid[i];
    if(c.g==='fouled'||c.w) continue;
    if(W.tick-(c.seen||0)>=limit)
      foul(c,'Ground nobody has stood on for '+limit+' steps goes bad on its own, and bad '+
        'ground takes the cells beside it '+FOUL_SPREAD+' steps later. sterilize() is the only thing '+
        'that clears it. Keep a patrol going, or keep the dish small enough to finish a lap.');
  }
  const taking=[];
  for(let i=0;i<grid.length;i++){
    const c=grid[i];
    if(c.g!=='fouled'||c.w) continue;
    if(W.tick-(c.ft||0)<FOUL_SPREAD) continue;
    c.ft=W.tick;                            // spreads again on the same clock
    const x=i%n, y=(i-x)/n;
    for(const q of neighbours(x,y)) taking.push(cell(q[0],q[1]));
  }
  for(const c of taking)
    if(foul(c,null)&&c.s!==null)
      hintOnce('foul-spread','Contamination has spread into a planted cell and destroyed what was in it. '+
        'It keeps spreading every '+FOUL_SPREAD+' steps until somebody sterilizes it.');
}
function resetFoulClock(){
  lastFoulScan=W.tick;

}
/* growing a crop in treated agar uses the treatment up */
function gained(r,n){
  if(W.trial||W.stage) return;              // scratch dishes are not your history
  W.stats.got=W.stats.got||{};
  W.stats.got[r]=(W.stats.got[r]||0)+n;
}
function spendSterility(c){
  if(c.g!=='sterile') return;
  c.sc=(c.sc||0)-1;
  if(c.sc<=0){ c.g='agar'; c.sc=0; }
}
function isMature(c){ return occupied(c) && (W.tick-c.t)>=growTime(c); }
function growth(c){ return c.s===null?0:Math.min(1,(W.tick-c.t)/growTime(c)); }
function wrap(v){ return ((v%W.size)+W.size)%W.size; }
function neighbours(x,y){
  return [[wrap(x+1),y],[wrap(x-1),y],[x,wrap(y+1)],[x,wrap(y-1)]];
}

/* ============================================================

const STEP={step:true}, TICK={tick:true};
const RT={

  sinceTick:0, acc:0, ticksFrame:0, out:0, samples:[], srcRunning:'',
  popBuf:[], fxBuf:[],                   // this frame's payouts, merged before they are drawn
  bestAtStart:{}, toldBest:{},           // the records this run is trying to beat

/* a short rolling window of resource totals, so the tiles can show a rate */
const RATE_EVERY=20, RATE_KEEP=50;
/* One point every HIST_EVERY steps, capped at HIST_KEEP points — about 48,000
   steps of shape at a size the save can carry. */
const HIST_EVERY=200, HIST_KEEP=240;
function sampleRate(){
  RT.samples.push({t:W.tick,res:Object.assign({},W.res)});
  while(RT.samples.length>RATE_KEEP) RT.samples.shift();
  if(RT.samples.length>=RATE_KEEP&&!W.trial&&!W.stage){
    W.stats.peak=W.stats.peak||{};
    for(const r of RES_ORDER){
      const v=rateFor(r);
      if(v<=(W.stats.peak[r]||0)) continue;
      /* Announce against the record as it stood when this run began, once per
         resource. Against the live peak it would fire on every sample while the
         rate climbed, and the news is "this program beats your last one". */
      if(v>(RT.bestAtStart[r]||0)&&!RT.toldBest[r]&&(RT.bestAtStart[r]||0)>0){
        RT.toldBest[r]=1;
        logLine('New best: '+v.toFixed(3)+' '+r+'/step, up from '+
          (RT.bestAtStart[r]).toFixed(3)+'.','good');
      }

    }
  }
}
function clearRates(){ RT.samples=[]; W.prof={}; W.profFail={}; }
function logHistory(){
  if(W.trial||W.stage) return;
  if(W.tick%HIST_EVERY!==0) return;
  W.hist=W.hist||[];
  const last=W.hist[W.hist.length-1];
  if(last&&last[0]===W.tick) return;
  W.hist.push([W.tick,W.res.bacteria,W.res.spores,W.res.enzymes,W.res.biomass,W.res.crystals]);
  while(W.hist.length>HIST_KEEP) W.hist.shift();
}
function rateFor(r){
  if(RT.samples.length<2) return 0;
  const a=RT.samples[0], b=RT.samples[RT.samples.length-1];
  const dt=b.t-a.t;
  if(dt<=0) return 0;
  return (W.res[r]-a.res[r])/dt;
}
/* A red cross tells you WHERE something failed. This tells you why - once per
   distinct reason per run, so a loop cannot flood the log. */
let hinted={};
function at(){ return ' at '+W.x+','+W.y; }
function hintOnce(key,msg){
  if(hinted[key]) return;
  hinted[key]=1;
  logLine(msg,'sys');
}
function advance(label,ok){
  RT.sinceTick=0;
  here().seen=W.tick;          // standing on a cell is what counts as tending it
  W.stats.acts=(W.stats.acts||0)+1;
  if(label==='move') W.stats.walked=(W.stats.walked||0)+1;
  W.lastAct=label; W.lastOk=ok!==false;
  W.prof[label]=(W.prof[label]||0)+1;
  if(ok===false){
    W.wasted++;
    W.profFail[label]=(W.profFail[label]||0)+1;
    W.flash={x:W.x,y:W.y,t:performance.now()};   // real time, so it shows at any speed
  }

/* --- actions (generators: mutate, then yield a tick) --- */
const DX=[0,1,0,-1], DY=[-1,0,1,0];
/* Outside the labyrinth the dish wraps at its edges. Inside it does not,
   and walls block movement, so move() can fail. */
/* Two bots used to stand in the same cell quite happily, which meant a second
   actuator was just the same lap run twice with an offset. They take up room
   now, so dividing the dish between them is a problem you have to solve.
   A round resolves bots in order, so the lower bot_id() wins a contested cell -
   arbitrary, but fixed, which is what lets you code around it. */
function botAt(x,y){
  for(let i=0;i<W.bots.length;i++){
    if(i===W.bot) continue;
    if(W.bots[i].x===x&&W.bots[i].y===y) return true;
  }
  return false;
}
function stepTarget(dir){
  if(W.maze){
    const nx=W.x+DX[dir], ny=W.y+DY[dir];
    if(nx<0||ny<0||nx>=W.size||ny>=W.size) return null;
    if(cell(nx,ny).w) return null;
    if(botAt(nx,ny)) return null;
    return [nx,ny];
  }
  const tx=wrap(W.x+DX[dir]), ty=wrap(W.y+DY[dir]);
  if(botAt(tx,ty)) return null;
  return [tx,ty];
}
function* aMove(dir){
  if(typeof dir!=='number'||dir<0||dir>3)
    throw new LangError('move() needs a direction: NORTH, EAST, SOUTH or WEST',RT.line);
  const t=stepTarget(dir);
  if(t){ W.x=t[0]; W.y=t[1]; }
  else if(W.bots.length>1&&botAt(wrap(W.x+DX[dir]),wrap(W.y+DY[dir])))
    hintOnce('move-bot','move() was blocked'+at()+': the other bot is standing in that cell. Two bots '+
      'cannot share one. A round runs them in order, so bot 0 takes a contested cell and bot 1 is '+
      'turned back — use bot_id() to give them different ground, or different work.');
  advance('move',t!==null);
  yield TICK;
  return t!==null;
}
/* Flat cost, whatever the distance. Priced by the distance is just goto(), which
   the player can already write in four lines, and one step flat would delete
   route planning altogether - a third of every program's steps are movement.
   Flat means there is a break-even distance, and finding it is the problem.
   It is also a tech that turns itself on as the dish grows: the longest walk on
   an n-wide torus is 2*floor(n/2), so this is worthless at 5x5, a toss-up at
   7x7 and decisive at 15x15. */
const JUMP_COST=4;
/* the shorter way round a torus, which is what you have to beat */
function torusWalk(x,y){
  const n=W.size;
  const dx=Math.abs(x-W.x), dy=Math.abs(y-W.y);
  return Math.min(dx,n-dx)+Math.min(dy,n-dy);
}
function* aJump(x,y){
  if(!W.feats.has('jump'))
    throw new LangError('jump() is locked — unlock Field displacer in the Lab',RT.line);
  if(typeof x!=='number'||typeof y!=='number'||!Number.isInteger(x)||!Number.isInteger(y))
    throw new LangError('jump() needs two whole numbers: jump(x, y)',RT.line);
  if(x<0||y<0||x>=W.size||y>=W.size)
    throw new LangError('jump('+x+', '+y+') is off the dish — it is '+W.size+'×'+W.size+
      ', so both need to be 0 to '+(W.size-1),RT.line);
  if(W.maze){
    hintOnce('jump-maze','jump() does nothing in the labyrinth — the walls are the puzzle. '+
      'Feel your way with blocked().');
    for(let i=0;i<JUMP_COST;i++){ advance('jump',false); yield TICK; }
    return false;
  }
  if(botAt(x,y)){
    hintOnce('jump-bot','jump('+x+', '+y+') was refused: the other bot is standing there. '+
      'A jump costs '+JUMP_COST+' steps whether it lands or not, so it is worth knowing where the other one is.');
    for(let i=0;i<JUMP_COST;i++){ advance('jump',false); yield TICK; }
    return false;
  }
  if(x===W.x&&y===W.y){
    hintOnce('jump-here','jump('+x+', '+y+') went nowhere — that is where the bot already is, '+
      'and it still cost '+JUMP_COST+' steps.');
    for(let i=0;i<JUMP_COST;i++){ advance('jump',false); yield TICK; }
    return false;
  }
  const walk=torusWalk(x,y);
  if(walk<JUMP_COST)
    hintOnce('jump-short','jump('+x+', '+y+') cost '+JUMP_COST+' steps to cover ground you could have '+
      'walked in '+walk+'. The dish wraps, so the way round is often shorter than it looks — the real '+
      'distance is min(dx, n-dx) + min(dy, n-dy).');
  jumpFx(W.x,W.y,x,y);
  W.x=x; W.y=y;
  for(let i=0;i<JUMP_COST;i++){ advance('jump',true); yield TICK; }
  return true;
}
function* aBlocked(dir){
  if(!W.feats.has('maze')) throw new LangError('blocked() is locked — unlock Labyrinth assay in the Lab',RT.line);
  if(typeof dir!=='number'||dir<0||dir>3)
    throw new LangError('blocked() needs a direction: NORTH, EAST, SOUTH or WEST',RT.line);
  const t=stepTarget(dir);
  if(FREE_SENSE()) return t===null;
  advance('blocked'); yield TICK; return t===null;
}
function* aMaze(){
  if(!W.feats.has('maze')) throw new LangError('maze() is locked — unlock Labyrinth assay in the Lab',RT.line);
  if(W.maze) restoreFarm();
  enterMaze();
  advance('maze'); yield TICK; return true;
}
function enterMaze(){
  W.saved={size:W.size,x:W.x,y:W.y,grid:W.grid.map(c=>({g:c.g,s:c.s,t:c.t,f:c.f,w:false,gt:c.gt}))};
  W.maze=true;
  genMaze();
  W.x=0; W.y=0; W.px=0; W.py=0;
}
function restoreFarm(){
  if(!W.saved) return;
  W.grid=W.saved.grid; W.size=W.saved.size;
  W.x=Math.min(W.saved.x,W.size-1); W.y=Math.min(W.saved.y,W.size-1);
  W.px=W.x; W.py=W.y;
  W.maze=false; W.saved=null; W.tx=-1; W.ty=-1;
}
/* recursive-backtracker maze; passages sit on even coordinates, which is why
   every dish size in the tree is odd */
function genMaze(){
  const n=W.size, key=(x,y)=>y*n+x;
  for(const c of W.grid){ c.w=true; c.s=null; c.t=0; c.f=0; c.g='sterile'; c.sc=STERILE_CROPS; }
  const seen=new Set([0]);
  cell(0,0).w=false;
  const stack=[[0,0]];
  while(stack.length){
    const cur=stack[stack.length-1], x=cur[0], y=cur[1];
    const opts=[];
    for(let d=0;d<4;d++){
      const nx=x+DX[d]*2, ny=y+DY[d]*2;
      if(nx<0||ny<0||nx>=n||ny>=n) continue;
      if(seen.has(key(nx,ny))) continue;
      opts.push([nx,ny,x+DX[d],y+DY[d]]);
    }
    if(!opts.length){ stack.pop(); continue; }
    const p=opts[Math.floor(RNG()*opts.length)];
    cell(p[0],p[1]).w=false; cell(p[2],p[3]).w=false;
    seen.add(key(p[0],p[1]));
    stack.push([p[0],p[1]]);
  }
  // bury the payload at the cell furthest from the entrance
  const dist=new Map([[0,0]]);
  let q=[[0,0]], far=[0,0], best=0;
  while(q.length){
    const nq=[];
    for(const p of q){
      const d0=dist.get(key(p[0],p[1]));
      for(let d=0;d<4;d++){
        const nx=p[0]+DX[d], ny=p[1]+DY[d];
        if(nx<0||ny<0||nx>=n||ny>=n) continue;
        if(cell(nx,ny).w||dist.has(key(nx,ny))) continue;
        dist.set(key(nx,ny),d0+1);
        if(d0+1>best){ best=d0+1; far=[nx,ny]; }
        nq.push([nx,ny]);
      }
    }
    q=nq;
  }

}

   the full harvest() + seed(). */

  return yield* aHarvest(true);
}
function* aSterilize(){
  if(W.maze){
    hintOnce('ster-maze','sterilize() does nothing in the labyrinth. Claim the payload and your culture comes back.');
    advance('sterilize',false); yield TICK; return false;
  }
  const c=here();
  /* Topping up a partly spent cell is real work; only treating one that is
     already at full strength changes nothing, and that is exactly as wasteful
     as grabbing at an empty cell, so it is reported the same way. */
  const changed=c.g!=='sterile'||(c.sc||0)<STERILE_CROPS;   // fouled counts as changed
  if(!changed)
    hintOnce('ster-full','sterilize()'+at()+' changed nothing — that cell is already at full '+
      'strength. Treatment lasts '+STERILE_CROPS+' crops and only wears down when something '+
      'is harvested there, so substrate() will tell you when it has run out.');
  /* Treating a cell wipes whatever is in it. That barely mattered when you only
     ever called this on bare agar; now that treatment expires you will be calling
     it inside a bed that is already running, so it has to say what it killed. */
  if(c.s!==null&&!isRotted(c))
    hintOnce('ster-kill','sterilize()'+at()+' destroyed the '+c.s+' growing there. Treating a cell '+
      'wipes it, so check substrate() before reaching for it in a bed that is already planted.');
  const wasFouled=c.g==='fouled';
  c.g='sterile'; c.sc=STERILE_CROPS; c.s=null; c.t=0; c.f=0; c.gt=0; c.ft=0;
  if(wasFouled) logLine('Contamination cleared at '+W.x+','+W.y+'.','good');
  advance('sterilize',changed);
  yield TICK;
  return changed;
}
function* aSeed(sp){

    throw new LangError('seed() needs a species, such as CULTURE',RT.line);
  if(!W.species.has(sp))
    throw new LangError(sp+' is not unlocked yet — see the Lab panel',RT.line);
  if(W.maze){
    hintOnce('seed-maze','seed() does nothing in the labyrinth \u2014 you are navigating, not farming. '+
      'Claim the payload and your culture comes back exactly as you left it.');
    advance('seed',false); yield TICK; return false;
  }
  const c=here(), def=SPECIES[sp];
  let ok=true;
  if(occupied(c)){
    ok=false;
    hintOnce('seed-busy-'+sp,'seed('+sp+') failed'+at()+': a '+c.s+' is growing there'+
      (isMature(c)?' and is ready to harvest':' and is not ripe yet')+
      '. Harvest it, or sterilize() to clear it.');
  }
  if(ok&&c.g==='fouled'){
    ok=false;
    hintOnce('seed-fouled','seed('+sp+') failed'+at()+': that ground is FOULED and nothing will take in it. '+
      'sterilize() is the only thing that clears contamination — and the longer it sits, the more of '+
      'the dish it takes.');
  }
  if(ok&&def.sterile&&c.g!=='sterile'){
    ok=false;
    hintOnce('seed-agar-'+sp,'seed('+sp+') failed'+at()+': '+sp+' only grows on sterile agar and that '+
      'cell reads AGAR. A sterilize() is good for '+STERILE_CROPS+' crops and then the ground goes '+
      'back to agar, so treated cells have to be treated again. substrate() tells you which is which.');
  }
  if(ok&&def.cost){
    const short=[];
    for(const k in def.cost) if(W.res[k]<def.cost[k]) short.push(def.cost[k]+' '+k+' (you have '+W.res[k]+')');
    if(short.length){
      ok=false;
      hintOnce('seed-cost-'+sp,'seed('+sp+') failed'+at()+': it costs '+short.join(' and ')+'.');
    }
    if(ok) for(const k in def.cost) W.res[k]-=def.cost[k];
  }
  if(ok){
    introMark('planted');
    c.s=sp; c.t=W.tick; c.gt=rollGrow(sp);
    c.f= sp==='CRYSTAL' ? 1+Math.floor(RNG()*(W.size*W.size)) : 0;
  }

}

      burst('PAYLOAD',W.x,W.y,RES_COL.crystals,null);
      pop(W.x,W.y,null,RES_COL.crystals,prize);
      W.stats.mazes=(W.stats.mazes||0)+1;
      if(W.trial&&W.trial.def.maze){ genMaze(); W.x=0; W.y=0; }   // next labyrinth

    if(prize<=0)
      hintOnce('harv-maze','harvest() in the labyrinth only claims the payload \u2014 the cell marked on the dish.');

    if(prize<=0&&!W.feats.has('grip')){ advance('harvest',false); yield TICK; }
    return prize>0;

      c.s=null; spendSterility(c);

      let adj=0;

    }
    else if(sp==='BIOFILM'){
      const patch=floodBiofilm(W.x,W.y);
      if(patch.every(p=>isMature(cell(p[0],p[1])))){
        const n=patch.length;
        /* The square is capped at BIO_COHERE cells. Uncapped, a patch that
           filled the dish paid its AREA squared - 2401 biomass on a 7x7, 50625
           on a 15x15 - so biomass arrived faster the bigger your dish got and
           one harvest bought a whole tier. Capped, the gradient from one cell

      let best=0;

function floodBiofilm(sx,sy){
  const seen=new Set([sy*W.size+sx]), stack=[[sx,sy]], out=[];
  while(stack.length){
    const p=stack.pop(); out.push(p);
    for(const q of neighbours(p[0],p[1])){
      const key=q[1]*W.size+q[0];
      if(seen.has(key)) continue;
      if(cell(q[0],q[1]).s!=='BIOFILM') continue;
      seen.add(key); stack.push(q);
    }
  }
  return out;
}

  if(!W.feats.has('measure')) throw new LangError('swap() is locked — unlock Crystal lattice in the Lab',RT.line);
  if(typeof dir!=='number'||dir<0||dir>3)
    throw new LangError('swap() needs a direction: NORTH, EAST, SOUTH or WEST',RT.line);
