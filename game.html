  let best=items[0], bestK=key?yield* callValue(key,[items[0]],[],line,'key'):items[0];
  for(let i=1;i<items.length;i++){
    const k=key?yield* callValue(key,[items[i]],[],line,'key'):items[i];
    if(pyCmp(k,bestK,line)*sign>0){ best=items[i]; bestK=k; }
  }
  return best;
}

/* --- evaluator --- */
function* execBlock(stmts,env){
  for(let i=0;i<stmts.length;i++){
    const r=yield* execStmt(stmts[i],env);
    if(r) return r;
  }
  return null;
}
function* execStmt(n,env){
  RT.line=n.line;
  yield STEP;
  switch(n.k){
    case 'seq': return yield* execBlock(n.body,env);
    case 'expr': yield* evalExpr(n.value,env); return null;
    case 'pass': return null;
    case 'break': return {t:'break'};
    case 'continue': return {t:'continue'};
    case 'global': for(const nm of n.names) env.declareGlobal(nm); return null;
    case 'return': {
      const v=n.value?yield* evalExpr(n.value,env):null;
      return {t:'return',v};
    }
    case 'assign': {
      const v=yield* evalExpr(n.value,env);
      for(const t of n.targets) yield* assignTo(t,v,env);
      return null;
    }
    case 'augassign': {
      const cur=yield* evalExpr(n.target,env);
      const inc=yield* evalExpr(n.value,env);
      yield* assignTo(n.target,binop(n.op,cur,inc,n.line),env);
      return null;
    }
    case 'if': {
      const t=yield* evalExpr(n.test,env);
      return yield* execBlock(truthy(t)?n.body:n.orelse,env);
    }
    case 'while': {
      let broke=false;
      while(true){
        const t=yield* evalExpr(n.test,env);
        if(!truthy(t)) break;
        const r=yield* execBlock(n.body,env);
        if(r){
          if(r.t==='break'){ broke=true; break; }
          if(r.t==='return') return r;
        }
        RT.line=n.line;
        yield STEP;
      }
      if(!broke&&n.orelse.length) return yield* execBlock(n.orelse,env);
      return null;
    }
    case 'for': {
      const it=yield* evalExpr(n.iter,env);
      const arr=iterate(it,n.line);
      let broke=false;
      for(let i=0;i<arr.length;i++){
        yield* assignTo(n.target,arr[i],env);
        const r=yield* execBlock(n.body,env);
        if(r){
          if(r.t==='break'){ broke=true; break; }
          if(r.t==='return') return r;
        }
        RT.line=n.line;
        yield STEP;
      }
      if(!broke&&n.orelse.length) return yield* execBlock(n.orelse,env);
      return null;
    }
    case 'raise': {
      let msg='Exception';
      if(n.exc){
        const v=yield* evalExpr(n.exc,env);
        if(v&&v.__exc) msg = v.msg ? (v.__exc+': '+v.msg) : v.__exc;
        else msg = typeof v==='string' ? ('Exception: '+v) : ('Exception: '+fmt(v));
      }
      throw new LangError(msg,n.line);
    }
    case 'try': {
      let out=null, raised=null;
      try{ out=yield* execBlock(n.body,env); }
      catch(e){
        if(!(e instanceof LangError)) throw e;
        const nm=excName(e.message);
        let handled=false;
        for(const h of n.handlers){
          if(h.type&&h.type!=='Exception'&&h.type!==nm) continue;
          if(h.name) env.set(h.name,excText(e.message));
          out=yield* execBlock(h.body,env);
          handled=true;
          break;
        }
        if(!handled) raised=e;
      }
      if(!raised&&!out&&n.orelse.length) out=yield* execBlock(n.orelse,env);
      if(n.fin.length){
        const f=yield* execBlock(n.fin,env);
        if(f) return f;                 // a return in finally wins, as in Python
      }
      if(raised) throw raised;
      return out;
    }
    case 'def': {
      // Python evaluates defaults once when the def executes, not per call
      const defs=[];
      for(const prm of n.params) defs.push(prm.def?yield* evalExpr(prm.def,env):undefined);
      env.set(n.name,{__fn:n,env,defs});
      return null;
    }
  }
  return null;
}

/* our errors read "ValueError: thing went wrong"; split the two halves so
   `except ValueError as e` can match the name and bind the message */
function excName(msg){ const m=/^([A-Za-z_][A-Za-z0-9_]*):\s/.exec(msg); return m?m[1]:'Exception'; }
function excText(msg){ const m=/^[A-Za-z_][A-Za-z0-9_]*:\s([\s\S]*)$/.exec(msg); return m?m[1]:msg; }
function* assignTo(t,v,env){
  if(t.k==='name'){ env.set(t.name,v); return; }
  if(t.k==='index'){
    const obj=yield* evalExpr(t.obj,env);
    const idx=yield* evalExpr(t.index,env);
    setIndex(obj,idx,v,t.line);
    return;
  }
  if(t.k==='tuple'||t.k==='listlit'){
    const items=iterate(v,t.line);
    if(items.length!==t.items.length)
      throw new LangError(items.length<t.items.length
        ? 'ValueError: not enough values to unpack (expected '+t.items.length+', got '+items.length+')'
        : 'ValueError: too many values to unpack (expected '+t.items.length+')', t.line);
    for(let i=0;i<t.items.length;i++) yield* assignTo(t.items[i],items[i],env);
    return;
  }
  throw new LangError('SyntaxError: cannot assign to this expression',t.line);
}
function setIndex(obj,idx,v,line){
  if(isTuple(obj)) throw new LangError("TypeError: 'tuple' object does not support item assignment",line);
  if(Array.isArray(obj)){ obj[normIndex(idx,obj.length,line,'list')]=v; return; }
  if(obj instanceof PyDict){ obj.set(idx,v); return; }
  throw new LangError("TypeError: '"+typeName(obj)+"' object does not support item assignment",line);
}
function getIndex(obj,idx,line){
  if(obj instanceof View)
    throw new LangError("TypeError: '"+obj.__view+"' object is not subscriptable",line);
  if(Array.isArray(obj)) return obj[normIndex(idx,obj.length,line,isTuple(obj)?'tuple':'list')];
  if(typeof obj==='string') return obj[normIndex(idx,obj.length,line,'string')];
  if(obj instanceof PyDict){
    if(!obj.has(idx)) throw new LangError('KeyError: '+rep(idx),line);
    return obj.get(idx);
  }
  throw new LangError("TypeError: '"+typeName(obj)+"' object is not subscriptable",line);
}

/* Real Python integers are unbounded; these are 64-bit floats. Rather than
   silently return a wrong number past 2^53, say so. */
function intGuard(r,exact,line){
  if(exact&&Number.isFinite(r)&&Math.abs(r)>Number.MAX_SAFE_INTEGER)
    throw new LangError('OverflowError: whole numbers above '+Number.MAX_SAFE_INTEGER+
      ' lose precision here (real Python has unlimited integers, this game does not)',line);
  return r;
}
function binop(op,a,b,line){
  if(op==='+'){
    if(typeof a==='string'&&typeof b==='string') return a+b;
    if(Array.isArray(a)&&Array.isArray(b)){
      if(isTuple(a)!==isTuple(b))
        throw new LangError('TypeError: can only concatenate '+typeName(a)+' to '+typeName(a),line);
      const out=a.concat(b);
      return isTuple(a)?mkTuple(out):out;
    }
  }
  if(op==='*'){
    if(typeof a==='string'&&typeof b==='number') return a.repeat(Math.max(0,Math.trunc(b)));
    if(typeof a==='number'&&typeof b==='string') return b.repeat(Math.max(0,Math.trunc(a)));
    if(Array.isArray(a)&&typeof b==='number'){
      const out=[]; for(let i=0;i<Math.max(0,Math.trunc(b));i++) for(const x of a) out.push(x);
      return isTuple(a)?mkTuple(out):out;
    }
  }
  const na=typeof a==='boolean'?(a?1:0):a, nb=typeof b==='boolean'?(b?1:0):b;
  if(typeof na!=='number'||typeof nb!=='number')
    throw new LangError("TypeError: unsupported operand type(s) for "+op+": '"+typeName(a)+"' and '"+typeName(b)+"'",line);
  const exact=Number.isInteger(na)&&Number.isInteger(nb);
  switch(op){
    case '+': return intGuard(na+nb,exact,line);
    case '-': return intGuard(na-nb,exact,line);
    case '*': return intGuard(na*nb,exact,line);
    case '/': if(nb===0) throw new LangError('ZeroDivisionError: division by zero',line); return na/nb;
    case '//': if(nb===0) throw new LangError('ZeroDivisionError: integer division or modulo by zero',line); return Math.floor(na/nb);
    case '%': if(nb===0) throw new LangError('ZeroDivisionError: integer division or modulo by zero',line); return ((na%nb)+nb)%nb;
    case '**': return intGuard(Math.pow(na,nb),exact,line);
  }
  throw new LangError('SyntaxError: unknown operator '+op,line);
}

function* evalExpr(n,env){
  switch(n.k){
    case 'lit': return n.v;
    case 'name': return env.get(n.name,n.line);
    case 'tuple': {
      const out=[];
      for(const it of n.items) out.push(yield* evalExpr(it,env));
      return mkTuple(out);
    }
    case 'listlit': {
      const out=[];
      for(const it of n.items) out.push(yield* evalExpr(it,env));
      return out;
    }
    case 'dictlit': {
      const m=new PyDict();
      for(const p of n.pairs){
        const k=yield* evalExpr(p[0],env);
        m.set(k,yield* evalExpr(p[1],env));
      }
      return m;
    }
    case 'comp': return yield* evalComp(n,env);
    case 'fstr': {
      let s='';
      for(const p of n.parts){
        if(p.lit!==undefined){ s+=p.lit; continue; }
        const v=yield* evalExpr(p.node,env);
        s+=applySpec(v,p.spec,n.line,p.conv);
      }
      return s;
    }
    case 'not': return !truthy(yield* evalExpr(n.v,env));
    case 'unary': {
      const v=yield* evalExpr(n.v,env);
      const x=typeof v==='boolean'?(v?1:0):v;
      if(typeof x!=='number')
        throw new LangError("TypeError: bad operand type for unary "+n.op+": '"+typeName(v)+"'",n.line);
      return n.op==='-'?-x:x;
    }
    case 'logic': {
      const l=yield* evalExpr(n.l,env);
      if(n.op==='and') return truthy(l)?yield* evalExpr(n.r,env):l;
      return truthy(l)?l:yield* evalExpr(n.r,env);
    }
    case 'ifexp': {
      const c=yield* evalExpr(n.test,env);
      return truthy(c)?yield* evalExpr(n.body,env):yield* evalExpr(n.orelse,env);
    }
    case 'chain': {
      let left=yield* evalExpr(n.first,env);
      for(const part of n.rest){
        const right=yield* evalExpr(part[1],env);
        if(!compareOne(part[0],left,right,part[2])) return false;
        left=right;
      }
      return true;
    }
    case 'bin': {
      const a=yield* evalExpr(n.l,env), b=yield* evalExpr(n.r,env);
      return binop(n.op,a,b,n.line);
    }
    case 'index': {
      const o=yield* evalExpr(n.obj,env);
      const i=yield* evalExpr(n.index,env);
      return getIndex(o,i,n.line);
    }
    case 'slice': {
      const o=yield* evalExpr(n.obj,env);
      if(!Array.isArray(o)&&typeof o!=='string')
        throw new LangError("TypeError: '"+typeName(o)+"' object is not subscriptable",n.line);
      const lo=n.lo?yield* evalExpr(n.lo,env):null;
      const hi=n.hi?yield* evalExpr(n.hi,env):null;
      const st=n.st?yield* evalExpr(n.st,env):null;
      return pySlice(o,lo,hi,st,n.line);
    }
    case 'attr': {
      const o=yield* evalExpr(n.obj,env);
      return {__bound:{obj:o,name:n.name,line:n.line}};
    }
    case 'lambda': {
      const defs=[];
      for(const prm of n.params) defs.push(prm.def?yield* evalExpr(prm.def,env):undefined);
      return {__fn:{name:'<lambda>',params:n.params,bodyExpr:n.body,line:n.line},env,defs};
    }
    case 'call': {
      const args=[];
      for(const a of n.args) args.push(yield* evalExpr(a,env));
      const kw=[];
      for(const p of n.kw) kw.push([p[0],yield* evalExpr(p[1],env)]);
      if(n.fn.k==='attr'){
        const o=yield* evalExpr(n.fn.obj,env);
        return yield* callMethod(o,n.fn.name,args,kw,n.line);
      }
      const f=yield* evalExpr(n.fn,env);
      return yield* callValue(f,args,kw,n.line,n.fn.k==='name'?n.fn.name:'expression');
    }
  }
  throw new LangError('SyntaxError: cannot evaluate this expression',n.line);
}

function compareOne(op,a,b,line){
  switch(op){
    case '==': return pyEq(a,b);
    case '!=': return !pyEq(a,b);
    case 'is': return a===b||(a===null&&b===null);
    case 'is not': return !(a===b||(a===null&&b===null));
    case 'in': return containsVal(b,a,line);
    case 'not in': return !containsVal(b,a,line);
    case '<': return pyCmp(a,b,line)<0;
    case '>': return pyCmp(a,b,line)>0;
    case '<=': return pyCmp(a,b,line)<=0;
    case '>=': return pyCmp(a,b,line)>=0;
  }
  throw new LangError('SyntaxError: unknown comparison '+op,line);
}
function containsVal(container,v,line){
  if(Array.isArray(container)) return container.some(x=>pyEq(x,v));
  if(container instanceof PyDict){
    let found=false;
    container.forEach((_,k)=>{ if(pyEq(k,v)) found=true; });
    return found;
  }
  if(typeof container==='string'){
    if(typeof v!=='string') throw new LangError("TypeError: 'in <string>' requires string as left operand",line);
    return container.indexOf(v)>=0;
  }
  throw new LangError("TypeError: argument of type '"+typeName(container)+"' is not iterable",line);
}

function* evalComp(n,env){
  const out=n.kind==='dict'?new PyDict():[];
  // Python 3 comprehensions have their own scope; the loop name must not leak
  yield* compLoop(n,new Env(env),0,out);
  return out;
}
function* compLoop(n,env,li,out){
  if(li>=n.loops.length){
    if(n.kind==='dict'){
      const k=yield* evalExpr(n.key,env);
      out.set(k,yield* evalExpr(n.val,env));
    } else out.push(yield* evalExpr(n.elt,env));
    return;
  }
  const L=n.loops[li];
  const seq=iterate(yield* evalExpr(L.iter,env),n.line);
  for(const item of seq){
    yield* assignTo(L.target,item,env);
    let keep=true;
    for(const c of L.ifs){ if(!truthy(yield* evalExpr(c,env))){ keep=false; break; } }
    if(keep) yield* compLoop(n,env,li+1,out);
    yield STEP;
  }
}

function* callValue(f,args,kw,line,label){
  kw=kw||[];
  if(f&&f.__bound) return yield* callMethod(f.__bound.obj,f.__bound.name,args,kw,line);
  if(f&&f.__pure){
    if(kw.length) throw new LangError('TypeError: '+label+'() takes no keyword arguments',line);
    return f.__pure.apply(null,args);
  }
  if(f&&f.__gen) return yield* f.__gen(args,kw,line);
  if(f&&f.__act){
    if(kw.length) throw new LangError('TypeError: '+label+'() takes no keyword arguments',line);
    if(args.length!==f.arity)
      throw new LangError('TypeError: '+label+'() takes '+f.arity+' positional argument'+
        (f.arity===1?'':'s')+' but '+args.length+(args.length===1?' was':' were')+' given',line);
    return yield* f.__act.apply(null,args);
  }
  if(f&&f.__fn){
    const d=f.__fn, params=d.params;
    const env=new Env(f.env&&f.env.parent?f.env:GLOBALS);
    if(args.length>params.length)
      throw new LangError('TypeError: '+(d.name||'<lambda>')+'() takes '+params.length+' positional argument'+
        (params.length===1?'':'s')+' but '+args.length+' were given',line);
    const bound=new Set();
    for(let i=0;i<args.length;i++){ env.set(params[i].name,args[i]); bound.add(params[i].name); }
    for(const p of kw){
      const idx=params.findIndex(q=>q.name===p[0]);
      if(idx<0) throw new LangError('TypeError: '+(d.name||'<lambda>')+"() got an unexpected keyword argument '"+p[0]+"'",line);
      if(bound.has(p[0])) throw new LangError('TypeError: '+(d.name||'<lambda>')+"() got multiple values for argument '"+p[0]+"'",line);
      env.set(p[0],p[1]); bound.add(p[0]);
    }
    const missing=[];
    for(let i=0;i<params.length;i++){
      const p=params[i];
      if(bound.has(p.name)) continue;
      if(p.def===null){ missing.push(p.name); continue; }
      env.set(p.name,f.defs?f.defs[i]:null);
    }
    if(missing.length){
      const q=missing.map(x=>"'"+x+"'");
      const list=q.length>1?q.slice(0,-1).join(', ')+' and '+q[q.length-1]:q[0];
      throw new LangError('TypeError: '+(d.name||'<lambda>')+'() missing '+missing.length+
        ' required positional argument'+(missing.length===1?'':'s')+': '+list,line);
    }
    if(++RT.depth>100){
      RT.depth--;
      throw new LangError('RecursionError: maximum recursion depth exceeded',line);
    }
    let result=null;
    if(d.bodyExpr) result=yield* evalExpr(d.bodyExpr,env);
    else{
      const r=yield* execBlock(d.body,env);
      result=r&&r.t==='return'?r.v:null;
    }
    RT.depth--;
    return result;
  }
  throw new LangError("TypeError: '"+typeName(f)+"' object is not callable",line);
}

function* callMethod(o,name,args,kw,line){
  kw=kw||[];
  if(Array.isArray(o)){
    if(isTuple(o)){
      if(name==='count') return o.filter(x=>pyEq(x,args[0])).length;
      if(name==='index'){
        const i=o.findIndex(x=>pyEq(x,args[0]));
        if(i<0) throw new LangError('ValueError: tuple.index(x): x not in tuple',line);
        return i;
      }
      throw new LangError("AttributeError: 'tuple' object has no attribute '"+name+"'",line);
    }
    switch(name){
      case 'append': o.push(args[0]); return null;
      case 'extend': for(const x of iterate(args[0],line)) o.push(x); return null;
      case 'insert': { let i=Math.trunc(args[0]); if(i<0)i+=o.length; o.splice(Math.max(0,Math.min(o.length,i)),0,args[1]); return null; }
      case 'pop': {
        if(!o.length) throw new LangError('IndexError: pop from empty list',line);
        if(!args.length) return o.pop();
        return o.splice(normIndex(args[0],o.length,line,'list'),1)[0];
      }
      case 'remove': {
        const i=o.findIndex(x=>pyEq(x,args[0]));
        if(i<0) throw new LangError('ValueError: list.remove(x): x not in list',line);
        o.splice(i,1); return null;
      }
      case 'index': {
        const i=o.findIndex(x=>pyEq(x,args[0]));
        if(i<0) throw new LangError('ValueError: '+rep(args[0])+' is not in list',line);
        return i;
      }
      case 'count': return o.filter(x=>pyEq(x,args[0])).length;
      case 'sort': {
        const key=kwGet(kw,'key',null), rev=truthy(kwGet(kw,'reverse',false));
        const keyed=[];
        for(const x of o) keyed.push([key?yield* callValue(key,[x],[],line,'key'):x,x]);
        keyed.sort((p,q)=>pyCmp(p[0],q[0],line));
        if(rev) keyed.reverse();
        for(let i=0;i<o.length;i++) o[i]=keyed[i][1];
        return null;
      }
      case 'reverse': o.reverse(); return null;
      case 'clear': o.length=0; return null;
      case 'copy': return o.slice();
    }
    throw new LangError("AttributeError: 'list' object has no attribute '"+name+"'",line);
  }
  if(o instanceof PyDict){
    switch(name){
      case 'keys': return mkView('dict_keys',Array.from(o.keys()));
      case 'values': return mkView('dict_values',Array.from(o.values()));
      case 'items': { const out=[]; o.forEach((v,k)=>out.push(mkTuple([k,v]))); return mkView('dict_items',out); }
      case 'get': return o.has(args[0])?o.get(args[0]):(args.length>1?args[1]:null);
      case 'pop': {
        if(o.has(args[0])){ const v=o.get(args[0]); o.delete(args[0]); return v; }
        if(args.length>1) return args[1];
        throw new LangError('KeyError: '+rep(args[0]),line);
      }
      case 'setdefault': {
        if(o.has(args[0])) return o.get(args[0]);
        const d=args.length>1?args[1]:null; o.set(args[0],d); return d;
      }
      case 'update': {
        const src=args[0];
        if(src instanceof PyDict) src.forEach((v,k)=>o.set(k,v));
        else for(const p of iterate(src,line)) o.set(p[0],p[1]);
        return null;
      }
      case 'clear': o.clear(); return null;
      case 'copy': return new PyDict(o);
    }
    throw new LangError("AttributeError: 'dict' object has no attribute '"+name+"'",line);
  }
  if(typeof o==='string'){
    switch(name){
      case 'upper': return o.toUpperCase();
      case 'lower': return o.toLowerCase();
      case 'strip': return o.trim();
      case 'lstrip': return o.replace(/^\s+/,'');
      case 'rstrip': return o.replace(/\s+$/,'');
      case 'split': {
        if(!args.length||args[0]===null) return o.split(/\s+/).filter(s=>s.length);
        return o.split(args[0]);
      }
      case 'join': return iterate(args[0],line).map(x=>{
        if(typeof x!=='string') throw new LangError('TypeError: sequence item must be str, not '+typeName(x),line);
        return x;
      }).join(o);
      case 'replace': return o.split(args[0]).join(args[1]);
      case 'startswith': return o.indexOf(args[0])===0;
      case 'endswith': return args[0]===''||o.slice(-args[0].length)===args[0];
      case 'find': return o.indexOf(args[0]);
      case 'index': {
        const i=o.indexOf(args[0]);
        if(i<0) throw new LangError('ValueError: substring not found',line);
        return i;
      }
      case 'count': { if(args[0]==='') return o.length+1; return o.split(args[0]).length-1; }
      case 'isdigit': return o.length>0&&/^[0-9]+$/.test(o);
      case 'isalpha': return o.length>0&&/^[A-Za-z]+$/.test(o);
      case 'title': return o.replace(/\w\S*/g,t=>t[0].toUpperCase()+t.slice(1).toLowerCase());
    }
    throw new LangError("AttributeError: 'str' object has no attribute '"+name+"'",line);
  }
  throw new LangError("AttributeError: '"+typeName(o)+"' object has no attribute '"+name+"'",line);
}

/* ============================================================
   DRIVER
   ============================================================ */
const SPEEDS=[1,2,4,8,16,32,64,128,256,512,1200,3000];
function maxSpeedIdx(){ return Math.min(SPEEDS.length-1,4+W.speedTier*2); }
function currentSpeed(){ return SPEEDS[Math.min(+els.spd.value,maxSpeedIdx())]; }

function compile(){
  const src=els.code.value;
  const feats=new Set(W.feats);
  const toks=tokenize(src);
  const ast=new Parser(toks,feats).program();
  return ast;
}

/* Three states, not two: idle (no program), paused (the program is alive and
   holding its place, but the frame loop leaves it alone) and running. Step
   needs the middle one, or it just hands control back to the frame loop. */
function updateButtons(){
  els.bRun.disabled = RT.running&&!RT.paused;
  els.bStop.disabled = !RT.running;
  els.bRun.textContent = (RT.running&&RT.paused)?'Resume':'Run';
}
/* Same program, one independent instance per bot: separate globals, separate
   variables, separate position. bot_id() is how a bot knows which one it is. */
function spawnBot(i){
  RT.globals[i]=buildGlobals();
  const prev=W.bot; W.bot=i;
  RT.gens[i]=execBlock(RT.ast,RT.globals[i]);
  W.bot=prev;
}
function spawnAll(){
  RT.gens=[]; RT.globals=[]; RT.roundI=0;
  for(let i=0;i<W.bots.length;i++) spawnBot(i);
}
function beginProgram(){
  clearErr();
  let ast;
  try{ ast=compile(); }
  catch(e){ showError(e); return false; }
  if(!ast.length){
    logLine('Nothing to run yet — write a program in the editor first.','sys');
    return false;
  }
  RT.ast=ast;
  spawnAll();
  RT.running=true; RT.depth=0; RT.acc=0; RT.sinceTick=0; RT.out=0;
  hinted={};
  /* the record to beat is the one as it stood when this run began; against the
     live peak the announcement would fire on every sample while the rate climbed */
  W.stats.peak=W.stats.peak||{};
  RT.bestAtStart=Object.assign({},W.stats.peak);
  RT.toldBest={};
  RT.srcRunning=els.code.value;
  updateApply();
  return true;
}
/* Wipe the dish back to a known state without touching what you have earned.
   Deliberately NOT what Stop does - stopping to read the log must be safe. */
function resetBoard(){
  if(W.trial||W.stage){ logLine('Finish or leave what you are in before resetting the dish.','sys'); return; }
  stopRun(null);
  let cleared=0;
  for(const c of W.grid) if(c.s!==null) cleared++;
  W.maze=false; W.saved=null; W.tx=-1; W.ty=-1;
  initGrid(W.size);
  homeBots();
  W.tick=0; W.wasted=0; W.lastOk=true; W.flash=null; W.pops=[]; W.fx=[];
  resetFoulClock();
  clearRates();
  logLine('Dish reset — '+cleared+' organism'+(cleared===1?'':'s')+' cleared, substrate back to agar, '+
          'bot home, step count and wasted back to zero. Resources and unlocks kept.','sys');
  save();
  renderRes(); renderStatus(); renderTrials(); sync();
}
function armStage(id){
  const def=STAGES.find(function(s){ return s.id===id; });
  if(!def) return;
  if(W.trial||W.stage){ logLine('Finish or leave what you are in first.','sys'); return; }
  if(!stageOpen(id)){ logLine('Earlier stages come first.','sys'); return; }
  stopRun(null);
  W.stage={
    def, count:0, streak:0, best:0, start:0, startTick:0,
    snap:{ size:W.size, x:W.x, y:W.y, tick:W.tick, wasted:W.wasted,
           species:new Set(W.species), feats:new Set(W.feats),
           grid:W.grid.map(packCell), res:Object.assign({},W.res),
           maze:W.maze, saved:W.saved, tx:W.tx, ty:W.ty,
           bots:W.bots.map(function(b){ return [b.x,b.y]; }) }
  };
  RNG=mulberry32(hashId(id));
  W.maze=false; W.saved=null; W.tx=-1; W.ty=-1;
  W.wasted=0; W.flash=null; W.lastOk=true; W.pops=[]; W.fx=[];
  clearRates();
  initGrid(def.size);
  homeBots(); W.tick=0;
  resetFoulClock();
  for(const k in W.res) W.res[k]=0;
  /* Lend every species between bacteria and the one this stage works in. The
     headline species alone is not enough now that nothing is staked: reaching
     s_bio only requires clearing s_myc, which lends MYCELIUM without granting
     it, so a player can arrive at the biofilm stage unable to make an enzyme.
     A stage with no species of its own still needs the chain under whatever it
     asks you to bank - s_sterile wants 600 spores and opens on s_culture, so
     it can be reached without ever having bought SPORE. */
  for(const sp of supplyChain(stageSpecies(def))) W.species.add(sp);
  if(def.feats) for(const f of def.feats) W.feats.add(f);
  def.setup();
  W.stage.start=W.res[def.res]||0;
  W.stage.startTick=W.tick;
  logLine('Stage: '+def.nm+'. '+stageGoalText(def)+' Press Run when ready.','good');
  renderTrials(); renderStatus(); sync();
}
/* what a stage is about: the species it teaches, or failing that whatever
   produces the resource it asks you to bank */
function stageSpecies(def){ return def.species || (def.res && RES_FROM[def.res]) || 'CULTURE'; }
function seedCostText(sp){
  const d=SPECIES[sp];
  if(!d.cost) return 'free to seed';
  return Object.keys(d.cost).map(function(r){ return d.cost[r]+' '+r; }).join(' + ')+' to seed';
}
function ripenText(sp){
  const d=SPECIES[sp];
  return (d.growVar?(d.growVar[0]+'\u2013'+d.growVar[1]):d.grow)+' steps to ripen'+
         (d.sterile?', needs STERILE':'');
}
function chainRows(sp){
  /* The Tasks column is narrow, so the chain is three tight columns rather than
     prose - the player is reading it to work out what a bed costs, not to read
     a sentence. Prices in full are still in Docs. */
  return '<span class="cost" style="margin-top:7px;color:var(--faint)">grown from nothing:</span>'+
    supplyChain(sp).map(function(s){
      const d=SPECIES[s];
      const cost=d.cost?Object.keys(d.cost).map(function(r){ return d.cost[r]+' '+r; }).join('+'):'free';
      const gt=(d.growVar?(d.growVar[0]+'–'+d.growVar[1]):d.grow)+'t';
      return '<span class="cost" style="margin-top:2px;gap:0">'+
        '<span style="color:'+d.col+';min-width:72px">'+s+'</span>'+
        '<span style="color:var(--dim);min-width:80px">'+cost+'</span>'+
        '<span style="color:var(--faint)">'+gt+(d.sterile?' · sterile':'')+'</span></span>';
    }).join('');
}
function stageGoalText(d){
  if(d.kind==='bank') return 'Bank '+d.target+' '+d.res+'.';
  if(d.kind==='streak') return d.target+' qualifying harvests in a row.';
  return d.target+' qualifying harvests.';
}
function stageProgress(){
  const st=W.stage;
  if(!st) return {now:0,target:0};
  const d=st.def;
  if(d.kind==='bank') return {now:Math.max(0,(W.res[d.res]||0)-st.start), target:d.target};
  if(d.kind==='streak') return {now:st.streak, target:d.target};
  return {now:st.count, target:d.target};
}
/* every harvest reports its quality here, so a stage can judge it */
function stageHarvest(sp,qual){
  const st=W.stage;
  if(!st) return;
  const d=st.def;
  if(d.kind==='bank') return;
  if(d.species&&sp!==d.species) return;
  if(qual>=d.need){
    if(d.kind==='streak'){ st.streak++; if(st.streak>st.best) st.best=st.streak; }
    else st.count++;
  } else if(d.kind==='streak'){
    if(st.streak>0) logLine('Streak broken at '+st.streak+' \u2014 that one had '+qual+', it needs '+d.need+'.','bad');
    st.streak=0;
  }
}
function leaveStage(){
  const st=W.stage;
  if(!st) return;
  const q=st.snap;
  W.size=q.size; W.grid=q.grid.map(unpackCell);
  setBotCount(q.bots.length);
  q.bots.forEach(function(b,i){ W.bots[i].x=b[0]; W.bots[i].y=b[1]; W.bots[i].px=b[0]; W.bots[i].py=b[1]; });
  W.tick=q.tick; W.wasted=q.wasted; W.res=q.res;
  W.maze=q.maze; W.saved=q.saved; W.tx=q.tx; W.ty=q.ty;
  if(q.species) W.species=q.species;      // the loan ends with the stage
  if(q.feats) W.feats=q.feats;
  W.stage=null; W.flash=null; W.pops=[]; W.fx=[];
  lastFoulScan=W.tick;
  RNG=Math.random;
}
function abortStage(msg){
  if(!W.stage) return;
  leaveStage(); stopRun(null);
  logLine(msg||'Left the stage. Your culture is back as it was.','sys');
  renderTrials(); renderLab(); sync();
}
function finishStage(){
  const st=W.stage, def=st.def;
  const steps=W.tick-st.startTick;
  leaveStage(); stopRun(null);
  W.done[def.id]=true;
  W.stageBest=W.stageBest||{};
  const prev=W.stageBest[def.id]||0;
  const pb=!prev||steps<prev;
  if(pb) W.stageBest[def.id]=steps;
  logLine('Stage cleared \u2014 '+def.nm+' in '+steps.toLocaleString()+' steps. '+
    'Par is '+def.par.toLocaleString()+'.'+
    (steps<def.par?' That beats the reference program.':'')+
    (pb&&prev?' Your best was '+prev.toLocaleString()+'.':''),'good');
  const rivalS=(W.rival||{})[def.id];
  if(rivalS!==undefined){
    if(steps<rivalS){
      logLine('That is '+(rivalS-steps).toLocaleString()+' steps under the '+rivalS.toLocaleString()+
        ' you were sent.','good');
      delete W.rival[def.id];
    } else {
      logLine('Still '+(steps-rivalS).toLocaleString()+' steps over the '+rivalS.toLocaleString()+
        ' you were sent.','sys');
    }
  }
  const names=def.opens.map(function(t){ const n=TECH.find(function(x){return x.id===t;}); return n?n.nm:t; });
  logLine(names.join(' and ')+' can now be bought in the Lab.','good');
  toast(def.nm+' cleared');
  renderTrials(); renderLab(); save(); sync();
}
function armTrial(id,forceSeed,isDaily){
  const def=CHALLENGES.find(c=>c.id===id);
  if(!def) return;
  if(W.trial||W.stage){ logLine('Finish or leave what you are in first.','sys'); return; }
  stopRun(null);
  // stash everything, including the real dish, so the trial changes nothing
  W.trial={
    def, endTick:0, start:0,
    snap:{ size:W.size, x:W.x, y:W.y, tick:W.tick, wasted:W.wasted,
           grid:W.grid.map(packCell), res:Object.assign({},W.res),
           maze:W.maze, saved:W.saved, tx:W.tx, ty:W.ty }
  };
  const seeded=forceSeed!==undefined||!!(W.seeds&&W.seeds[id]!==undefined);
  const useSeed=forceSeed!==undefined?forceSeed:((W.seeds&&W.seeds[id]!==undefined)?W.seeds[id]:hashId(id));
  RNG=mulberry32(useSeed);                              // canonical, rolled, shared or today's
  W.maze=false; W.saved=null; W.tx=-1; W.ty=-1;
  W.wasted=0; W.flash=null; W.lastOk=true; W.pops=[]; W.fx=[];
  clearRates();
  initGrid(def.size);
  homeBots(); W.tick=0;
  resetFoulClock();
  for(const k in W.res) W.res[k]=0;
  def.setup(seeded);
  W.trial.start=W.res[def.goal]||0;
  W.trial.endTick=def.steps;
  W.trial.seeded=seeded;
  W.trial.daily=!!isDaily;
  logLine('Trial ready: '+def.nm+' — '+def.steps+' steps, scoring '+def.goal+
          '. Press Run when your program is ready.','good');
  renderTrials(); renderStatus(); sync();
}
/* par is bronze; silver and gold are multiples of it. One number to tune. */
function tierOf(def,score){
  let got=null;
  for(const t of TIERS) if(score>=Math.round(def.par*t[1])) got=t[0];
  return got;
}
function tierTarget(def,name){
  for(const t of TIERS) if(t[0]===name) return Math.round(def.par*t[1]);
  return def.par;
}
function nextTier(def,score){
  for(const t of TIERS) if(score<Math.round(def.par*t[1])) return t[0];
  return null;
}
const TIER_COL={bronze:'#c98a52',silver:'#b9c4c2',gold:'#ffce4d'};
/* Share codes.

   The engine is deterministic and every trial already builds its dish from a
   string hash, so a seed IS a dish. That makes "beat my score on this exact
   board" a twenty-character string rather than a server: PA1.sort.k3f9.38g is
   the trial, the dish, and the number to beat.

   Deliberately no program in the code. The thing worth sending someone is the
   challenge, not the answer - a solution code would just be a spoiler, and it
   would be ten times longer. */
const CODE_TAG='PA1';
function b36(n){ return Math.max(0,Math.round(n)).toString(36); }
function makeCode(id,seed,score){
  return [CODE_TAG,id,b36(seed),b36(score)].join('.');
}
function isStageId(id){ return id.slice(0,2)==='s_'; }
function codeTarget(id){
  return isStageId(id) ? STAGES.find(function(x){ return x.id===id; })
                       : CHALLENGES.find(function(x){ return x.id===id; });
}
function readCode(txt){
  const m=String(txt||'').trim().replace(/^.*?(PA1\.)/i,'$1').split('.');
  if(m.length!==4||m[0].toUpperCase()!==CODE_TAG) return null;
  if(!codeTarget(m[1])) return null;
  const seed=parseInt(m[2],36), score=parseInt(m[3],36);
  if(!isFinite(seed)||!isFinite(score)) return null;
  return {id:m[1],seed:seed>>>0,score:score,stage:isStageId(m[1])};
}
function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t);
      return true;
    }
  }catch(e){}
  return false;
}
function shareTrial(id,seedOverride){
  const stage=isStageId(id);
  const seed=seedOverride!==undefined?seedOverride:((W.seeds&&W.seeds[id])||hashId(id));
  const score=stage?((W.stageBest||{})[id]||0):((W.best||{})[id]||0);
  const code=makeCode(id,seed,score);
  if(copyText(code)) toast('Code copied');
  logLine('Challenge code: '+code+'  '+DASHC+'  '+
    (score?(stage?'cleared in '+score+' steps.':'your '+score+' to beat.'):'not cleared yet.')+
    ' Anyone who pastes it gets this exact dish.','good');
}
function takeCode(txt){
  const c=readCode(txt);
  if(!c){ logLine('That is not a challenge code. They look like PA1.sort.k3f9.38g','bad'); return false; }
  const def=codeTarget(c.id);
  W.rival=W.rival||{}; W.rival[c.id]=c.score;
  if(c.stage){
    /* the curriculum is a fixed teaching board, so a stage code carries a time
       rather than a dish - and it is won by taking fewer steps, not more */
    logLine('Challenge accepted: '+def.nm+', cleared in '+c.score+' steps. Beat that.','good');
  } else {
    W.seeds=W.seeds||{}; W.seeds[c.id]=c.seed;
    logLine('Challenge accepted: '+def.nm+', their dish, '+c.score+' '+def.goal+' to beat.','good');
  }
  renderTrials(); save();
  return true;
}
/* Today's dish.

   Derived from the UTC date, so every player in the world gets the same board on
   the same day without a server deciding anything. The trial rotates too, so it
   is not one puzzle with different numbers. Its code is an ordinary share code,
   so somebody can hand you a past day's dish and you can play it.

   This is the habit: a fixed, comparable puzzle that is gone tomorrow. */
function dailyKey(d){
  const t=d||new Date();
  const p=function(n){ return (n<10?'0':'')+n; };
  return t.getUTCFullYear()+'-'+p(t.getUTCMonth()+1)+'-'+p(t.getUTCDate());
}
function dailyFor(key){
  const h=hashId('daily:'+key);
  return { key:key, seed:h, def:CHALLENGES[h%CHALLENGES.length] };
}
function dailyToday(){ return dailyFor(dailyKey()); }
/* a new day clears yesterday's score rather than letting it pass for today's */
function rollDaily(){
  const d=dailyToday();
  W.daily=W.daily||{};
  if(W.daily.key!==d.key){ W.daily={key:d.key,best:0}; save(); }
  return d;
}
function rollTrial(id){
  W.seeds=W.seeds||{};
  W.seeds[id]=(Math.random()*4294967296)>>>0;
  if(W.rival) delete W.rival[id];
  logLine('New dish rolled for that trial. Same rules, ground you have not seen.','sys');
  renderTrials(); save();
}
const DASHC='—';
function hashId(id){ let h=2166136261; for(let i=0;i<id.length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function restoreFromTrial(){
  const t=W.trial; if(!t) return;
  const s=t.snap;
  W.size=s.size; W.grid=s.grid.map(unpackCell);
  W.x=s.x; W.y=s.y; W.px=s.x; W.py=s.y;
  W.tick=s.tick; W.wasted=s.wasted; W.res=s.res;
  W.maze=s.maze; W.saved=s.saved; W.tx=s.tx; W.ty=s.ty;
  W.trial=null; W.flash=null;
  RNG=Math.random;
}
function abortTrial(msg){
  if(!W.trial) return;
  restoreFromTrial();
  stopRun(null);
  logLine(msg||'Trial abandoned. Your culture is back as it was.','sys');
  renderTrials(); sync();
}
function finishTrial(){
  const t=W.trial, def=t.def;
  const score=Math.max(0,(W.res[def.goal]||0)-t.start);
  /* a rolled or shared dish is a different board, so it does not touch the
     record for the canonical one - that comparison would be meaningless */
  const prev=t.seeded?score:(W.best[def.id]||0);
  const beat=t.seeded?false:score>prev;
  if(beat) W.best[def.id]=score;
  const wasted=W.wasted;
  restoreFromTrial();
  stopRun(null);
  logLine('Trial complete — '+def.nm+': '+score+' '+def.goal+
          ' in '+def.steps+' steps ('+wasted+' wasted).'+
          (t.seeded?'  On a rolled dish, so it does not touch your record.'
                   :(beat?(prev?'  NEW BEST, up from '+prev+'.':'  First score.'):'  Best is still '+prev+'.')),
          beat?'good':'sys');
  if(t.daily){
    W.daily=W.daily||{key:dailyKey(),best:0};
    if(score>(W.daily.best||0)){
      W.daily.best=score;
      logLine('Best on today’s dish so far.','good');
    }
  }
  const rival=(W.rival||{})[def.id];
  if(rival!==undefined){
    if(score>rival){
      logLine('You beat the '+rival+' you were sent. This dish is yours now.','good');
      delete W.rival[def.id];
    } else {
      logLine('Still '+(rival-score)+' short of the '+rival+' you were sent.','sys');
    }
  }
  const tier=t.seeded?null:tierOf(def,score), had=t.seeded?null:tierOf(def,prev);
  if(tier&&tier!==had) logLine('That is '+tier.toUpperCase()+'.','good');
  else if(tier) logLine('Still '+tier+'.','sys');
  const nxt=nextTier(def,Math.max(score,prev));
  if(nxt) logLine(nxt.charAt(0).toUpperCase()+nxt.slice(1)+' needs '+tierTarget(def,nxt)+'.','sys');
  else logLine('Every tier on this one is cleared.','good');
  W.stats.trials=(W.stats.trials||0)+1;
  renderTrials(); save(); sync();
}
/* Editing while it runs used to need Stop then Run. Now the edit applies in
   place: the world keeps its dish, the program restarts from the top. */
function editsPending(){ return RT.running && els.code.value!==RT.srcRunning; }
function updateApply(){ if(els.bApply) els.bApply.hidden=!editsPending(); }
function applyChanges(loud){
  if(!RT.running){ if(loud) startRun(); return true; }
  let ast;
  try{ ast=compile(); }
  catch(e){ if(loud) showError(e); updateApply(); return false; }
  RT.ast=ast;
  spawnAll();
  RT.depth=0; RT.sinceTick=0;
  RT.srcRunning=els.code.value;
  clearErr();
  if(loud) logLine('Program updated \u2014 restarted from the top, dish untouched.','good');
  updateApply();
  return true;
}
let liveT=0;
function scheduleLive(){
  updateApply();
  if(!els.live||!els.live.checked||!editsPending()) return;
  clearTimeout(liveT);
  liveT=setTimeout(function(){ if(editsPending()) applyChanges(false); },600);
}
function startRun(){
  if(RT.running){
    if(RT.paused){ RT.paused=false; RT.acc=0; updateButtons(); logLine('Resumed.','sys'); }
    return;
  }
  if(!beginProgram()) return;
  RT.paused=false;
  updateButtons();
  logLine('Program started.','good');
}
function restartProgram(){ spawnAll(); RT.depth=0; RT.sinceTick=0; }
function stopRun(msg){
  if(!RT.running&&!msg) return;
  if(els.bApply) els.bApply.hidden=true;
  RT.running=false; RT.paused=false; RT.gens=[]; RT.globals=[]; RT.roundI=0; RT.line=0;
  updateButtons();
  if(msg) logLine(msg,'sys');
  save();
}

/* Advance one bot until it performs exactly one action.
   'acted' | 'done' | 'error' | 'spin' (used its slice of the frame, resume later) */
function stepBot(i){
  const g=RT.gens[i];
  if(!g) return 'done';
  W.bot=i;
  GLOBALS=RT.globals[i];
  let n=0;
  while(true){
    if(++n>30000) return 'spin';
    let r;
    try{ r=g.next(); }
    catch(e){ RT.err=e; return 'error'; }
    if(r.done) return 'done';
    if(r.value===TICK) return 'acted';
    if(++RT.sinceTick>400000){
      RT.err=new LangError('This loop ran a very long time without the bot doing anything — stopped it.',RT.line);
      return 'error';
    }
  }
}
function failRun(){
  showError(RT.err);
  if(W.trial) abortTrial('Trial ended early: the program raised an error.');
  else if(W.stage) abortStage('Stage ended early: the program raised an error.');
  else stopRun(null);
}
function pump(budget){
  let guard=0;
  while(RT.ticksFrame<budget){
    if(++guard>20000) return;
    /* one round: every live bot takes a single action, then the clock moves once */
    while(RT.roundI<RT.gens.length){
      const i=RT.roundI;
      let r=stepBot(i);
      if(r==='done'&&els.rep.checked){ spawnBot(i); r=stepBot(i); }
      if(r==='spin') return;                 // resume this same bot next frame
      if(r==='error'){ failRun(); return; }
      if(r==='done') RT.gens[i]=null;
      RT.roundI++;
    }
    RT.roundI=0;
    if(RT.gens.every(function(g){ return !g; })){ stopRun('Program finished.'); return; }
    W.tick++; RT.ticksFrame++; RT.sinceTick=0;
    foulCatchUp();
    if(W.tick%RATE_EVERY===0) sampleRate();
    logHistory();
    if(W.trial&&W.tick>=W.trial.endTick){ finishTrial(); return; }
    if(W.stage){ const pr=stageProgress(); if(pr.now>=pr.target){ finishStage(); return; } }
  }
}
function singleStep(){
  if(!RT.running){
    if(!beginProgram()) return;
    logLine('Stepping. Press Resume to let it run.','good');
  }
  RT.paused=true;          // hold position so the frame loop does not take over
  RT.acc=0;
  RT.ticksFrame=0;
  pump(1);
  updateButtons();
  sync();
}

/* ============================================================
   DOM
   ============================================================ */
const els={};
['code','hl','gutter','console','res','dish','stage','status','labpane','apipane','trialpane','profpane','slotSel','slotName','slotNew','slotDel','bBoard','bApply','live',
 'bRun','bStop','bStep','bClear','bReset','spd','spdv','rep','notrace'].forEach(id=>els[id]=document.getElementById(id));

/* --- console --- */
let logCount=0;
function logLine(text,cls){
  if(RT.out>300) return;
  RT.out++;
  const d=document.createElement('div');
  const n=document.createElement('span'); n.className='n'; n.textContent=String(++logCount);
  const t=document.createElement('span'); t.className=cls||'out'; t.textContent=text;
  d.appendChild(n); d.appendChild(t);
  els.console.appendChild(d);
  while(els.console.childElementCount>250) els.console.removeChild(els.console.firstChild);
  els.console.scrollTop=els.console.scrollHeight;
}
function showError(e){
  if(e instanceof LangError){
    RT.errLine=e.line;
    logLine('Line '+e.line+': '+e.message,'bad');
  } else {
    RT.errLine=0;
    logLine('Internal error: '+e.message,'bad');
  }
  paintLines();
}
function clearErr(){ RT.errLine=0; }

/* --- editor highlight --- */
const HL_KW=/\b(if|elif|else|while|for|in|def|return|break|continue|pass|and|or|not|True|False|None|lambda|is|global)\b/;
const ACTIONS=['move','harvest','seed','sterilize','scan','mature','substrate','measure','swap','maze','blocked','in_maze',
               'print','pos_x','pos_y','dish_size','num','range','len','abs','min','max','sum','int','str','sorted','random','randint',
               'round','pow','float','repr','bool','list','tuple','dict','type','enumerate','zip','reversed','any','all','map','filter','choice'];
const CONSTS=['NORTH','EAST','SOUTH','WEST','CULTURE','SPORE','MYCELIUM','BIOFILM','CRYSTAL','AGAR','STERILE','PAYLOAD',
              'BACTERIA','SPORES','ENZYMES','BIOMASS','CRYSTALS'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function highlightLine(src){
  let out='', i=0;
  while(i<src.length){
    const c=src[i];
    if(c==='#'){ out+='<span class="t-cmt">'+esc(src.slice(i))+'</span>'; break; }
    if(c==='"'||c==="'"){
      let j=i+1;
      while(j<src.length&&src[j]!==c){ if(src[j]==='\\')j++; j++; }
      out+='<span class="t-str">'+esc(src.slice(i,Math.min(j+1,src.length)))+'</span>'; i=j+1; continue;
    }
    if(/[0-9]/.test(c)&&!/[A-Za-z0-9_]/.test(src[i-1]||' ')){
      let j=i; while(j<src.length&&/[0-9.]/.test(src[j]))j++;
      out+='<span class="t-num">'+src.slice(i,j)+'</span>'; i=j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i; while(j<src.length&&/[A-Za-z0-9_]/.test(src[j]))j++;
      const w=src.slice(i,j);
      let cls='';
      if(HL_KW.test(w)&&HL_KW.exec(w)[0]===w) cls='t-kw';
      else if(CONSTS.indexOf(w)>=0) cls='t-const';
      else if(ACTIONS.indexOf(w)>=0&&src[j]==='(') cls='t-fn';
      out+= cls?'<span class="'+cls+'">'+w+'</span>':esc(w);
      i=j; continue;
    }
    if('+-*/%<>=(),:[]{}.'.indexOf(c)>=0){ out+='<span class="t-op">'+esc(c)+'</span>'; i++; continue; }
    out+=esc(c); i++;
  }
  return out;
}
let lineEls=[], hlin=null, gutin=null;
function renderEditor(){
  const lines=els.code.value.split('\n');
  els.hl.innerHTML='<div class="edin">'+
    lines.map(l=>'<span class="ln">'+(highlightLine(l)||' ')+'</span>').join('')+'</div>';
  els.gutter.innerHTML='<div class="edin">'+
    lines.map((_,i)=>'<i>'+(i+1)+'</i>').join('')+'</div>';
  hlin=els.hl.firstChild||null; gutin=els.gutter.firstChild||null;
  lineEls=hlin&&hlin.children?Array.prototype.slice.call(hlin.children):[];
  paintLines();
  syncScroll();
}
let paintedCur=-1, paintedErr=-1;
/* Above this many steps in a single frame the highlighted line is just whatever
   the last tick happened to land on, so it strobes across the whole program and
   makes the editor unreadable. Past it, stop tracing and say so. */
const TRACE_MAX=6;
let lastFrameTicks=0, tracedOff=null;
function paintLines(){
  const tooFast=RT.running&&!RT.paused&&lastFrameTicks>TRACE_MAX;
  if(tooFast!==tracedOff){
    tracedOff=tooFast;
    els.notrace.hidden=!tooFast;
  }
  const cur=(RT.running&&!tooFast)?RT.line:0, err=RT.errLine;
  if(cur===paintedCur&&err===paintedErr) return;
  if(paintedCur>0&&lineEls[paintedCur-1]) lineEls[paintedCur-1].classList.remove('cur');
  if(paintedErr>0&&lineEls[paintedErr-1]) lineEls[paintedErr-1].classList.remove('err');
  if(cur>0&&lineEls[cur-1]) lineEls[cur-1].classList.add('cur');
  if(err>0&&lineEls[err-1]) lineEls[err-1].classList.add('err');
  paintedCur=cur; paintedErr=err;
}
/* Translate the layers instead of scrolling them. A textarea showing a
   horizontal scrollbar is ~9px shorter inside, so its maximum scrollTop is
   larger than the overlay's - syncing by scrollTop clamps, and the caret drifts
   up to half a line away from its own text. A transform cannot clamp. */
function syncScroll(){
  const x=-els.code.scrollLeft, y=-els.code.scrollTop;
  if(hlin) hlin.style.transform='translate('+x+'px,'+y+'px)';
  if(gutin) gutin.style.transform='translateY('+y+'px)';
}

els.code.addEventListener('input',()=>{ clearErr(); storeSlot(); renderEditor(); saveSoon(); scheduleLive(); });
els.code.addEventListener('scroll',syncScroll);
els.code.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); applyChanges(true); return; }
  if(e.key==='Tab'){
    e.preventDefault();
    const s=els.code.selectionStart, en=els.code.selectionEnd, v=els.code.value;
    els.code.value=v.slice(0,s)+'    '+v.slice(en);
    els.code.selectionStart=els.code.selectionEnd=s+4;
    renderEditor(); saveSoon();
  } else if(e.key==='Enter'){
    const s=els.code.selectionStart, v=els.code.value;
    const ls=v.lastIndexOf('\n',s-1)+1;
    const line=v.slice(ls,s);
    const ind=(line.match(/^[ \t]*/)||[''])[0];
    const extra=/:\s*$/.test(line)?'    ':'';
    e.preventDefault();
    const en=els.code.selectionEnd;
    els.code.value=v.slice(0,s)+'\n'+ind+extra+v.slice(en);
    els.code.selectionStart=els.code.selectionEnd=s+1+ind.length+extra.length;
    renderEditor(); saveSoon();
  }
});

/* --- tech tree --- */
function canAfford(c){ for(const k in c) if(W.res[k]<c[k]) return false; return true; }
let labSel=null;

/* Three branches, drawn as a trace that fills in behind you. The zigzag is the
   intended order through a group; the trace between two nodes lights only when
   both ends are owned, so the diagram reads as a facility coming online. */
const LAB_W=286, NODE_W=124, NODE_H=32, ROW=54, COLX=[12,150];
function labGroups(){
  const out=[]; let g=null;
  for(const t of TECH){
    if(!g||g.name!==t.g){ g={name:t.g,items:[]}; out.push(g); }
    g.items.push(t);
  }
  return out;
}
const TASK_COL='#ffd24d';
function stageLock(t){
  const sg=STAGE_GATE[t.id];
  return (sg&&!W.owned.has(t.id)&&!stageDone(sg))?sg:null;
}
function nodeState(t){
  if(W.owned.has(t.id)) return 'own';
  const pre=TECH_REQ[t.id]||[];
  if(pre.some(function(id){ return !W.owned.has(id); })) return 'blocked';
  /* affordable but not earned is its own thing, and the most important thing
     to show: the player has done the work, they just need the task */
  if(stageLock(t)) return canAfford(t.cost)?'task':'tasklock';
  return canAfford(t.cost)?'ready':'poor';
}

/* Four things, ticking themselves off as you do them.

   Telling somebody what to do is a wall of text they skim; showing them what
   they have already done is a scoreboard they finish. It reacts to the world
   rather than to a script, so there is no tutorial to get out of sync with the
   game, and it deletes itself the moment the fourth line goes green. */
const INTRO=[
  ['planted',  'Plant something',            'seed(CULTURE) on an empty cell'],
  ['harvested','Take it once it is ripe',    'harvest() on a cell that has finished growing'],
  ['banked',   'Bank 32 bacteria',           'enough to buy your first upgrade'],
  ['looped',   'Buy Iteration in the Lab',   'while loops, so the program can keep going']
];
function introDone(){ return INTRO.every(function(r){ return (W.intro||{})[r[0]]; }); }
function introMark(k){
  W.intro=W.intro||{};
  if(W.intro[k]) return;
  W.intro[k]=1;
  if(introDone()) logLine('That is the loop the whole game is built on. The rest is making it faster.','good');
  renderLab();
}
function introCheck(){
  if(introDone()) return;
  if(W.res.bacteria>=32) introMark('banked');
  if(W.owned.has('loop')) introMark('looped');
}
function introHtml(){
  if(introDone()) return '';
  let h='<div class="grp" style="margin-top:2px">First steps</div>'+
        '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px">';
  for(const r of INTRO){
    const got=!!(W.intro||{})[r[0]];
    h+='<tr><td style="width:15px;padding:3px 0;color:'+(got?'var(--cyan)':'var(--faint)')+'">'+
       (got?'✓':'○')+'</td>'+
       '<td style="color:'+(got?'var(--dim)':'var(--ink)')+
       (got?';text-decoration:line-through':'')+'">'+r[1]+
       '<div style="font-family:var(--mono);font-size:10px;color:var(--faint)">'+r[2]+'</div></td></tr>';
  }
  return h+'</table>';
}
function renderLab(){
  if(!els.labpane) return;
  const groups=labGroups();
  let svg='', head='';
  head+=introHtml();
  head+='<button class="tiny" id="labReset" style="margin-bottom:10px;width:100%;padding:6px;text-align:center">'+
        'reset dish — clear the board, bot home, keep everything earned</button>';

  for(const g of groups){
    const col=GROUP_COL[g.name]||'#4fe3c1';
    const n=g.items.length;
    const h=10+n*ROW;
    svg+='<div class="grp" style="color:'+col+'">'+g.name+'</div>';
    svg+='<svg class="labsvg" viewBox="0 0 '+LAB_W+' '+h+'" width="100%" height="'+h+'" '+
         'preserveAspectRatio="xMidYMin meet">';
    /* traces first so nodes sit on top */
    for(let i=0;i<n-1;i++){
      const a=g.items[i], b=g.items[i+1];
      const ax=COLX[i%2]+NODE_W/2, ay=8+i*ROW+NODE_H;
      const bx=COLX[(i+1)%2]+NODE_W/2, by=8+(i+1)*ROW;
      const lit=W.owned.has(a.id)&&W.owned.has(b.id);
      svg+='<path d="M'+ax+' '+ay+' C'+ax+' '+(ay+14)+', '+bx+' '+(by-14)+', '+bx+' '+by+'" '+
           'fill="none" stroke="'+(lit?col:'#3a534d')+'" stroke-width="'+(lit?2.2:1.5)+'" '+
           (lit?'':'stroke-dasharray="4 4" ')+'opacity="'+(lit?0.95:0.85)+'"/>';
    }
    for(let i=0;i<n;i++){
      const t=g.items[i], st=nodeState(t);
      const x=COLX[i%2], y=8+i*ROW;
      let fill='#0d1615', stroke='#1d2b28', tc='#4e615c', sw=1;
      if(st==='own'){ fill=col+'26'; stroke=col; tc='#d8e6e1'; sw=1.4; }
      else if(st==='ready'){ fill='#0e1c1a'; stroke=col; tc=col; sw=1.6; }
      else if(st==='task'){ fill='#221c08'; stroke=TASK_COL; tc=TASK_COL; sw=1.8; }
      else if(st==='tasklock'){ fill='#15130c'; stroke='#6b5a28'; tc='#8a7940'; }
      else if(st==='poor'){ fill='#0d1615'; stroke='#2a3c38'; tc='#7b938c'; }
      const sel=labSel===t.id;
      svg+='<g class="labnode" data-id="'+t.id+'" style="cursor:pointer">';
      if(sel) svg+='<rect x="'+(x-3)+'" y="'+(y-3)+'" width="'+(NODE_W+6)+'" height="'+(NODE_H+6)+
                   '" rx="7" fill="none" stroke="#d8e6e1" stroke-width="1" opacity=".75"/>';
      svg+='<rect x="'+x+'" y="'+y+'" width="'+NODE_W+'" height="'+NODE_H+'" rx="5" '+
           'fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      svg+='<text x="'+(x+NODE_W/2)+'" y="'+(y+NODE_H/2+4)+'" text-anchor="middle" '+
           'font-family="Chakra Petch, sans-serif" font-size="11" fill="'+tc+'">'+
           esc(shortName(t))+'</text>';
      if(st==='own')
        svg+='<text x="'+(x+NODE_W-9)+'" y="'+(y+12)+'" text-anchor="middle" font-size="10" fill="'+col+'">✓</text>';
      if(st==='blocked')
        svg+='<text x="'+(x+9)+'" y="'+(y+NODE_H/2+4)+'" text-anchor="middle" font-size="10" fill="#4e615c">·</text>';
      if(st==='task'||st==='tasklock')
        svg+='<text x="'+(x+NODE_W-9)+'" y="'+(y+12)+'" text-anchor="middle" font-size="11" fill="'+
             (st==='task'?TASK_COL:'#6b5a28')+'">⚑</text>';
      svg+='</g>';
    }
    svg+='</svg>';
  }
  els.labpane.innerHTML=head+svg+'<div id="labcard"></div>';
  const rb=document.getElementById('labReset');
  if(rb) rb.addEventListener('click',resetBoard);
  els.labpane.querySelectorAll('.labnode').forEach(function(el){
    el.addEventListener('click',function(){ labSel=el.dataset.id; renderLab(); });
  });
  renderLabCard();
}

function renderLabCard(){
  const box=document.getElementById('labcard');
  if(!box) return;
  if(!labSel){
    box.innerHTML='<div class="grp">Detail</div>'+
      '<div style="font-size:11.5px;color:var(--dim);line-height:1.45">Pick anything above to read what it '+
      'does and buy it. Filled nodes are yours; the trace lights up between two you own.</div>';
    return;
  }
  const t=TECH.find(function(x){ return x.id===labSel; });
  if(!t){ box.innerHTML=''; return; }
  const st=nodeState(t), col=GROUP_COL[t.g]||'#4fe3c1';
  let cost='';
  for(const k in t.cost){
    const short=W.res[k]<t.cost[k];
    cost+='<span style="color:'+(short?'var(--warn)':RES_COL[k])+'">'+t.cost[k]+' '+k+
          (short?' (have '+W.res[k]+')':'')+'</span>';
  }
  let h='<div class="grp" style="color:'+col+'">'+t.g+'</div>'+
        '<div class="tcard'+(st==='own'?' done':'')+'">'+
        '<span class="nm" style="color:'+(st==='own'?'var(--dim)':col)+'">'+t.nm+
        (st==='own'?' ✓':'')+'</span>'+
        '<span class="ds">'+t.ds+'</span>'+
        (st==='own'?'':'<span class="cost">'+cost+'</span>');
  const sg=stageLock(t);
  if(st==='blocked')
    h+='<span class="ds" style="color:var(--warn);margin-top:6px">Needs '+
       reqMissing(t).join(' and ')+' first.</span>';
  if(sg){
    const stg=STAGES.find(function(x){ return x.id===sg; });
    const open=stageOpen(sg);
    h+='<span class="ds" style="color:'+TASK_COL+';margin-top:6px">'+
       (st==='task'?'You can afford this. ':'')+
       'It has to be earned: clear the <strong>'+stg.nm+'</strong> stage.'+
       (open?'':' Earlier stages come first.')+'</span>';
  }
  if(st!=='own'){
    h+='<div class="trow">';
    if(sg){
      const open=stageOpen(sg)&&!W.trial&&!W.stage;
      h+='<button class="tbtn" id="labstage" style="'+
         (open?'background:'+TASK_COL+';border-color:'+TASK_COL+';color:#241d04':'opacity:.4')+'"'+
         (open?'':' disabled')+'>Begin stage</button>';
    } else {
      h+='<button class="tbtn'+(st==='ready'?' go':'')+'" id="labbuy"'+
         (st==='ready'?'':' disabled style="opacity:.4"')+'>'+
         (st==='blocked'?'Locked':st==='ready'?'Buy':'Too expensive')+'</button>';
    }
    h+='</div>';
  }
  h+='</div>';
  box.innerHTML=h;
  const bb=document.getElementById('labbuy');
  if(bb&&st==='ready') bb.addEventListener('click',function(){ buy(t); });
  const sb=document.getElementById('labstage');
  if(sb&&!sb.disabled) sb.addEventListener('click',function(){ armStage(sg); showPane('trials'); });
}

function buy(t){
  if(W.owned.has(t.id)) return;
  /* Stage and trial resources are scored and thrown away, and leaveStage puts
     W.res and W.feats back from the snapshot while W.owned is not restored --
     buying in here left you owning a tech whose feature had been stripped. */
  if(W.trial||W.stage){ toast('Not while you are in a '+(W.stage?'stage':'trial')); return; }
  if(!reqMet(t)){ toast('Needs '+reqMissing(t).join(' + ')+' first'); return; }
  if(!canAfford(t.cost)){ toast('Not enough resources'); return; }
  for(const k in t.cost) W.res[k]-=t.cost[k];
  W.owned.add(t.id);
  if(t.feat) W.feats.add(t.feat);
  if(t.species) W.species.add(t.species);
  if(t.species==='SPORE'){
    W.feats.add('sterile');
    resetFoulClock();          // the neglect clock starts now, not back at tick zero
    logLine('Sterile technique online. Contamination starts from here: ground left untended goes bad '+
      'and takes its neighbours, and sterilize() is what clears it. Keep a lap going over everything '+
      'you have planted.','sys');
  }
  if(t.size){
    // a bigger dish means a different labyrinth, so any run in progress is forfeit
    if(W.maze){ restoreFarm(); logLine('Labyrinth abandoned to fit the new dish.','sys'); }
    resizeGrid(t.size);
  }
  if(t.speed) W.speedTier+=t.speed;
  if(t.twin){ setBotCount(2); homeBots(); if(RT.running) spawnAll(); }
  toast(t.nm+' unlocked');
  renderLab(); renderRes(); renderApi(); updateSpeedLabel(); save();
}
let toastEl=null,toastT=0;
function toast(msg){
  if(toastEl) toastEl.remove();
  toastEl=document.createElement('div'); toastEl.className='toast'; toastEl.textContent=msg;
  document.body.appendChild(toastEl);
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ if(toastEl){toastEl.remove();toastEl=null;} },2200);
}

/* --- saved programs ---
   Slots are just named buffers. What you type is written straight into the
   active slot, so switching away can never lose work. */
function ensureSlots(){
  if(!Array.isArray(W.slots)||!W.slots.length)
    W.slots=[{name:'main',code:els.code.value||STARTER}];
  if(typeof W.slot!=='number'||W.slot<0||W.slot>=W.slots.length) W.slot=0;
}
function renderSlots(){
  ensureSlots();
  els.slotSel.innerHTML='';
  W.slots.forEach(function(sl,i){
    const o=document.createElement('option');
    o.value=String(i);
    o.textContent=(i+1)+'. '+(sl.name||'untitled');
    if(i===W.slot) o.selected=true;
    els.slotSel.appendChild(o);
  });
  if(document.activeElement!==els.slotName) els.slotName.value=W.slots[W.slot].name||'';
  els.slotDel.disabled=W.slots.length<2;
  els.slotDel.style.opacity=W.slots.length<2?'.35':'1';
}
function storeSlot(){
  ensureSlots();
  W.slots[W.slot].code=els.code.value;
}
function loadSlot(i){
  ensureSlots();
  storeSlot();
  W.slot=Math.max(0,Math.min(i,W.slots.length-1));
  els.code.value=W.slots[W.slot].code||'';
  renderEditor(); renderSlots(); save();
  logLine('Loaded program: '+(W.slots[W.slot].name||'untitled')+'.','sys');
  if(RT.running) updateApply();
}
function newSlot(){
  ensureSlots();
  storeSlot();
  if(W.slots.length>=12){ logLine('Twelve program slots is the limit.','sys'); return; }
  W.slots.push({name:'program '+(W.slots.length+1),code:'# a fresh program\n\n'});
  W.slot=W.slots.length-1;
  els.code.value=W.slots[W.slot].code;
  renderEditor(); renderSlots(); save();
}
function deleteSlot(){
  ensureSlots();
  if(W.slots.length<2) return;
  const gone=W.slots[W.slot].name||'untitled';
  W.slots.splice(W.slot,1);
  W.slot=Math.min(W.slot,W.slots.length-1);
  els.code.value=W.slots[W.slot].code||'';
  renderEditor(); renderSlots(); save();
  logLine('Deleted program: '+gone+'.','sys');
}

/* --- trials --- */
let trialNote=null;
function renderTrials(){
  if(!els.trialpane) return;
  trialNote=null;
  els.trialpane.innerHTML=
    '<div class="grp">Curriculum</div>'+
    '<div style="font-size:11.5px;color:var(--dim);line-height:1.45;margin:0 0 10px">'+
    'Each stage sets up a clean dish and asks you to prove one thing. Clearing it is what lets the '+
    'Lab sell you the next species — resources decide when you can afford it, these decide whether '+
    'you have earned it. Your own culture is untouched.<br><br>'+
    'A stage gives you nothing: an empty dish and an empty ledger, and every cell you plant has to '+

  for(const st of STAGES){
    const done=stageDone(st.id), open=stageOpen(st.id), live=W.stage&&W.stage.def.id===st.id;
    const card=document.createElement('div');
    card.className='tcard'+(live?' live':(done?' done':''));
    if(!open&&!done) card.style.opacity='.45';
    const opens=st.opens.map(function(t){ const n=TECH.find(function(x){return x.id===t;}); return n?n.nm:t; });
    card.innerHTML='<span class="nm" style="color:'+(done?'var(--ok)':live?'var(--amber)':'var(--ink)')+'">'+
        st.nm+(done?' ✓':'')+'</span>'+
      '<span class="ds">'+st.ds+'</span>'+
      '<span class="cost">'+
        '<span style="color:var(--dim)">'+st.size+'×'+st.size+'</span>'+
        '<span style="color:var(--faint)">'+stageGoalText(st)+'</span>'+
        '<span style="color:#8ef58a">opens '+opens.join(' + ')+'</span>'+
        '<span style="color:var(--faint)">par '+st.par.toLocaleString()+' steps</span>'+
        (((W.stageBest||{})[st.id])?'<span style="color:var(--amber)">your best '+
          W.stageBest[st.id].toLocaleString()+'</span>':'')+
        (((W.rival||{})[st.id]!==undefined)?'<span style="color:var(--ice)">chasing '+
          W.rival[st.id].toLocaleString()+'</span>':'')+
      '</span>'+
      chainRows(stageSpecies(st));
    const row=document.createElement('div');
    row.className='trow';
    if(live){
      const pr=stageProgress();
      const note=document.createElement('span');
      note.style.cssText='font-family:var(--mono);font-size:11px;color:var(--amber);align-self:center;margin-right:auto';
      note.textContent=RT.running?(pr.now+' / '+pr.target):'ready — press Run';
      trialNote=note;
      row.appendChild(note);
      const drop=document.createElement('button');
      drop.className='tbtn drop'; drop.textContent='Leave';
      drop.addEventListener('click',function(){ abortStage(); });
      row.appendChild(drop);
    } else if(!done){
      const go=document.createElement('button');
      go.className='tbtn'+(open?' go':'');
      go.textContent=open?'Begin':'Locked';
      go.disabled=!open||!!W.trial||!!W.stage;
      if(go.disabled) go.style.opacity='.4';
      else go.addEventListener('click',function(){ armStage(st.id); });
      row.appendChild(go);
    } else {
      const again=document.createElement('button');
      again.className='tbtn'; again.textContent='Replay';
      again.disabled=!!W.trial||!!W.stage;
      if(again.disabled) again.style.opacity='.4';
      else again.addEventListener('click',function(){ armStage(st.id); });
      row.appendChild(again);
      const shs=document.createElement('button');
      shs.className='tbtn'; shs.textContent='Share';
      shs.addEventListener('click',function(){ shareTrial(st.id); });
      row.appendChild(shs);
    }
    card.appendChild(row);
    els.trialpane.appendChild(card);
  }

  /* today's dish, above everything, because it is the thing that expires */
  const dy=rollDaily();
  const dh=document.createElement('div');
  dh.className='grp'; dh.textContent='Today';
  els.trialpane.appendChild(dh);
  const dcard=document.createElement('div');
  const dlive=W.trial&&W.trial.daily;
  dcard.className='tcard'+(dlive?' live':(W.daily&&W.daily.best?' done':''));
  dcard.innerHTML='<span class="nm">'+dy.def.nm+'</span>'+
    '<span class="ds">Everyone gets this same dish today, and a different one tomorrow. '+
    dy.def.ds+'</span>'+
    '<span class="cost">'+
      '<span style="color:var(--ice)">'+dy.key+'</span>'+
      '<span style="color:var(--dim)">'+dy.def.size+'×'+dy.def.size+' · '+dy.def.steps+' steps</span>'+
      '<span style="color:'+RES_COL[dy.def.goal]+'">scores '+dy.def.goal+'</span>'+
      ((W.daily&&W.daily.best)?'<span style="color:var(--amber)">today’s best '+W.daily.best+'</span>':'')+
    '</span>';
  const drow=document.createElement('div');
  drow.className='trow';
  if(dlive){
    const dn=document.createElement('span');
    dn.style.cssText='font-family:var(--mono);font-size:11px;color:var(--amber);align-self:center;margin-right:auto';
    dn.textContent=RT.running?(Math.max(0,W.trial.endTick-W.tick)+' steps left'):'ready — press Run';
    trialNote=dn;
    drow.appendChild(dn);
    const dd=document.createElement('button');
    dd.className='tbtn drop'; dd.textContent='Abandon';
    dd.addEventListener('click',function(){ abortTrial(); });
    drow.appendChild(dd);
  } else {
    const dgo=document.createElement('button');
    dgo.className='tbtn go'; dgo.textContent=(W.daily&&W.daily.best)?'Play again':'Play';
    dgo.disabled=!!W.trial||!!W.stage;
    if(dgo.disabled) dgo.style.opacity='.4';
    else dgo.addEventListener('click',function(){ armTrial(dy.def.id,dy.seed,true); });
    drow.appendChild(dgo);
    const dsh=document.createElement('button');
    dsh.className='tbtn'; dsh.textContent='Share';
    dsh.addEventListener('click',function(){
      const code=makeCode(dy.def.id,dy.seed,(W.daily&&W.daily.best)||0);
      if(copyText(code)) toast('Code copied');
      logLine('Today’s dish ('+dy.key+'): '+code+'  '+DASHC+'  '+
        ((W.daily&&W.daily.best)?'your '+W.daily.best+' to beat.':'unscored so far.'),'good');
    });
    drow.appendChild(dsh);
  }
  dcard.appendChild(drow);
  els.trialpane.appendChild(dcard);

  const th=document.createElement('div');
  th.className='grp'; th.textContent='Trials';
  els.trialpane.appendChild(th);
  const tb=document.createElement('div');
  tb.style.cssText='font-size:11.5px;color:var(--dim);line-height:1.45;margin:0 0 10px';
  tb.textContent='Optional, and scored. A fixed dish and a step budget, identical every attempt, so a '+
                 'better score means better code. Nothing earned inside is kept. Roll for a dish nobody '+
                 'has seen, or paste somebody else’s code to take theirs.';
  els.trialpane.appendChild(tb);
  const paste=document.createElement('div');
  paste.style.cssText='display:flex;gap:6px;margin:0 0 10px';
  const pin=document.createElement('input');
  pin.type='text'; pin.placeholder='paste a challenge code';
  pin.style.cssText='flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink);'+
    'background:#111c1a;border:1px solid var(--line2);border-radius:3px;padding:4px 7px';
  const pgo=document.createElement('button');
  pgo.className='tbtn'; pgo.textContent='Take';
  const accept=function(){ if(takeCode(pin.value)) pin.value=''; };
  pgo.addEventListener('click',accept);
  pin.addEventListener('keydown',function(e){ if(e.key==='Enter') accept(); });
  paste.appendChild(pin); paste.appendChild(pgo);
  els.trialpane.appendChild(paste);

  for(const c of CHALLENGES){
    const best=W.best[c.id]||0;
    const live=W.trial&&W.trial.def.id===c.id;
    const card=document.createElement('div');
    card.className='tcard'+(live?' live':(best>=Math.round(c.par*2.4)?' done':''));
    card.innerHTML='<span class="nm">'+c.nm+'</span><span class="ds">'+c.ds+'</span>'+
      '<span class="cost">'+
        '<span style="color:var(--dim)">'+c.size+'×'+c.size+' · '+c.steps+' steps</span>'+
        '<span style="color:'+RES_COL[c.goal]+'">scores '+c.goal+'</span>'+
      '</span><span class="cost" style="margin-top:4px">'+
        TIERS.map(function(t){
          const need=Math.round(c.par*t[1]), got=best>=need;
          return '<span style="color:'+(got?TIER_COL[t[0]]:'var(--faint)')+'">'+
                 (got?'◆':'◇')+' '+t[0]+' '+need+'</span>';
        }).join('')+
        (best?'<span style="color:var(--ink)">best '+best+'</span>':'')+
      '</span>'+
      (((W.seeds||{})[c.id]!==undefined)||((W.rival||{})[c.id]!==undefined)
        ?'<span class="cost" style="margin-top:4px">'+
          (((W.seeds||{})[c.id]!==undefined)?'<span style="color:var(--ice)">shared dish</span>':'')+
          (((W.rival||{})[c.id]!==undefined)?'<span style="color:var(--amber)">chasing '+W.rival[c.id]+'</span>':'')+
         '</span>':'');
    const row=document.createElement('div');
    row.className='trow';
    if(live){
      const note=document.createElement('span');
      note.style.cssText='font-family:var(--mono);font-size:11px;color:var(--amber);align-self:center;margin-right:auto';
      note.textContent=RT.running?(Math.max(0,W.trial.endTick-W.tick)+' steps left'):'ready — press Run';
      trialNote=note;
      row.appendChild(note);
      const drop=document.createElement('button');
      drop.className='tbtn drop'; drop.textContent='Abandon';
      drop.addEventListener('click',function(){ abortTrial(); });
      row.appendChild(drop);
    } else {
      const go=document.createElement('button');
      go.className='tbtn go'; go.textContent=best?'Retry':'Load';
      go.disabled=!!W.trial||!!W.stage;
      if(go.disabled) go.style.opacity='.4';
      else go.addEventListener('click',function(){ armTrial(c.id); });
      row.appendChild(go);
      const roll=document.createElement('button');
      roll.className='tbtn'; roll.textContent='Roll dish';
      roll.disabled=!!W.trial||!!W.stage;
      if(roll.disabled) roll.style.opacity='.4';
      else roll.addEventListener('click',function(){ rollTrial(c.id); });
      row.appendChild(roll);
      const sh=document.createElement('button');
      sh.className='tbtn'; sh.textContent='Share';
      sh.addEventListener('click',function(){ shareTrial(c.id); });
      row.appendChild(sh);
      if((W.seeds||{})[c.id]!==undefined){
        const rst=document.createElement('button');
        rst.className='tbtn'; rst.textContent='Original';
        rst.disabled=!!W.trial||!!W.stage;
        if(rst.disabled) rst.style.opacity='.4';
        else rst.addEventListener('click',function(){
          delete W.seeds[c.id];
          if(W.rival) delete W.rival[c.id];
          logLine('Back to the original dish for that trial.','sys');
          renderTrials(); save();
        });
        row.appendChild(rst);
      }
    }
    card.appendChild(row);
    els.trialpane.appendChild(card);
  }
}

/* --- profiler --- */
function bar(pct,col){
  return '<span style="display:block;height:6px;background:#1b2b28;border-radius:3px;overflow:hidden">'+
         '<span style="display:block;height:6px;width:'+pct.toFixed(1)+'%;background:'+col+'"></span></span>';
}
function renderProf(){
  if(!els.profpane||els.profpane.hidden) return;
  const total=Object.keys(W.prof).reduce(function(a,k){return a+W.prof[k];},0);
  let h='<div class="grp">Where the steps went</div>';
  if(!total){
    h+='<div style="font-size:11.5px;color:var(--dim);line-height:1.45">Nothing measured yet. '+
       'Run a program \u2014 every action it takes is counted here. Resetting the dish starts a fresh measurement.</div>';
    els.profpane.innerHTML=h+recordHtml(); return;
  }
  h+='<div style="font-size:11.5px;color:var(--dim);margin-bottom:8px">'+total+
     ' steps measured. A step spent walking or looking is a step not spent harvesting.</div>'+
     '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  const rows=Object.keys(W.prof).sort(function(a,b){return W.prof[b]-W.prof[a];});
  for(const k of rows){
    const n=W.prof[k], pct=100*n/total, bad=W.profFail[k]||0;
    h+='<tr><td style="padding:3px 0;color:var(--ink)">'+k+'</td>'+
       '<td style="text-align:right;color:var(--dim);font-variant-numeric:tabular-nums">'+n+'</td>'+
       '<td style="text-align:right;width:44px;color:var(--dim);font-variant-numeric:tabular-nums">'+pct.toFixed(1)+'%</td>'+
       '<td style="width:62px;padding-left:8px">'+bar(pct,bad?'var(--warn)':'var(--cyan)')+'</td>'+
       '<td style="text-align:right;width:56px;color:var(--warn)">'+(bad?bad+' failed':'')+'</td></tr>';
  }
  h+='</table>';
  // count waste from the same window the table covers, not the lifetime total
  const lost=Object.keys(W.profFail).reduce(function(a,k){return a+W.profFail[k];},0);
  const wpct=total?100*lost/total:0;
  h+='<div class="grp">Waste</div><div style="font-family:var(--mono);font-size:11.5px;color:'+
     (wpct>15?'var(--warn)':'var(--dim)')+'">'+lost+' of '+total+' steps ('+wpct.toFixed(1)+
     '%) accomplished nothing.'+
     (W.wasted!==lost?' <span style="color:var(--faint)">('+W.wasted+' wasted all told)</span>':'')+
     '</div>';
  h+='<div class="grp">Yield</div>';
  let any='';
  for(const r of RES_ORDER){
    const rt=rateFor(r);
    if(!rt) continue;
    any+='<tr><td style="padding:3px 0;color:'+RES_COL[r]+'">'+r+'</td>'+
         '<td style="text-align:right;color:var(--ink);font-variant-numeric:tabular-nums">'+
         (rt>0?'+':'')+rt.toFixed(4)+' /step</td></tr>';
  }
  h+= any?('<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">'+any+'</table>')
        :'<div style="font-size:11.5px;color:var(--dim)">No resource is moving right now.</div>';
  h+=recordHtml();
  els.profpane.innerHTML=h;
}
function xy(n){ return String(Math.round(n*100)/100); }
/* Lifetime totals as bars, on a log scale: bacteria run to hundreds of thousands
   while crystals are in the hundreds, and on a linear axis every bar but one is
   invisible. The number beside each bar is the real figure. */
function gatheredHtml(){
  const g=(W.stats||{}).got||{};
  const any=RES_ORDER.filter(function(r){ return g[r]; });
  if(!any.length) return '';
  const top=Math.max.apply(null,RES_ORDER.map(function(r){ return g[r]||0; }));
  const lg=function(v){ return v>0?Math.log10(v+1):0; };
  let h='<div class="grp">Everything you have gathered</div>'+
        '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  for(const r of RES_ORDER){
    const v=g[r]||0, w=top>0?Math.round(100*lg(v)/lg(top)):0;
    h+='<tr><td style="padding:3px 0;width:62px;color:'+(v?RES_COL[r]:'var(--faint)')+'">'+r+'</td>'+
       '<td style="padding-right:8px"><div style="height:9px;border-radius:2px;background:#0c1614">'+
       '<div style="height:9px;border-radius:2px;width:'+w+'%;background:'+RES_COL[r]+';opacity:.82"></div></div></td>'+
       '<td style="text-align:right;width:74px;color:var(--ink);font-variant-numeric:tabular-nums">'+
       v.toLocaleString()+'</td></tr>';
  }
  h+='</table><div style="font-size:10.5px;color:var(--faint);margin-top:4px">'+
     'Bars are log-scaled — the tiers are orders of magnitude apart.</div>';
  return h;
}
/* The shape of the run: five lines, each normalised to its own peak, so a
   resource that only ever reaches 300 is still readable beside one at 300,000.
   What you are reading is the SHAPE - where a line went flat is where that tier
   stalled, and that is the thing worth seeing. */
function historyHtml(){
  const hs=W.hist||[];
  if(hs.length<3) return '<div class="grp">The run so far</div>'+
    '<div style="font-size:11.5px;color:var(--dim);line-height:1.45">Not enough history yet. '+
    'A point is logged every '+HIST_EVERY+' steps once a program is running.</div>';
  const Wd=262, Hg=96, pad=3;
  const t0=hs[0][0], t1=hs[hs.length-1][0], span=Math.max(1,t1-t0);
  let h='<div class="grp">The run so far</div>'+
        '<svg viewBox="0 0 '+Wd+' '+Hg+'" width="100%" height="'+Hg+'" style="display:block">'+
        '<rect x="0" y="0" width="'+Wd+'" height="'+Hg+'" fill="#0a1211" rx="3"/>';
  for(let i=1;i<4;i++)
    h+='<line x1="0" y1="'+(Hg*i/4)+'" x2="'+Wd+'" y2="'+(Hg*i/4)+'" stroke="#16211f" stroke-width="1"/>';
  RES_ORDER.forEach(function(r,ri){
    const col=ri+1;
    let top=0;
    for(const p of hs) if(p[col]>top) top=p[col];
    if(top<=0) return;
    let d='';
    hs.forEach(function(p,i){
      const x=pad+(Wd-pad*2)*(p[0]-t0)/span;
      const y=Hg-pad-(Hg-pad*2)*(p[col]/top);
      d+=(i?'L':'M')+xy(x)+' '+xy(y);
    });
    h+='<path d="'+d+'" fill="none" stroke="'+RES_COL[r]+'" stroke-width="1.6" '+
       'stroke-linejoin="round" opacity=".9"/>';
  });
  h+='</svg><div style="font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.45">'+
     'Each line is scaled to its own peak, so read the shape rather than the height. '+
     'Flat means that tier stalled. '+(t1-t0).toLocaleString()+' steps shown.</div>';
  return h;
}
function recordHtml(){
  const st=W.stats||{};
  const rows=[
    ['steps taken',      st.acts||0],
    ['cells walked',     st.walked||0],
    ['organisms taken',  st.harvests||0],
    ['labyrinths solved',st.mazes||0],
    ['trials run',       st.trials||0]
  ];
  let h='<div class="grp">The record</div>'+
        '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  for(const r of rows)
    h+='<tr><td style="padding:3px 0;color:var(--dim)">'+r[0]+'</td>'+
       '<td style="text-align:right;color:var(--ink);font-variant-numeric:tabular-nums">'+r[1]+'</td></tr>';
  h+='</table>';
  /* The tech tree runs out at around 79,000 steps and then there is nothing left
     to chase, which is a strange way to end an optimisation game. This is the
     scoreboard that carries on afterwards: the peak is already a sustained rate
     over a 1000-step window, so all it needed was targets worth aiming at.
     Gold sits above what the reference programs in stages/ manage, so clearing
     it means writing something better than anything in the repo. */
  const pk=st.peak||{};
  h+='<div class="grp">Rate ladder</div>'+
     '<div style="font-size:11px;color:var(--faint);margin:-2px 0 6px;line-height:1.45">'+
     'Your best sustained rate, measured over a thousand steps. Gold is past what the reference '+
     'programs manage.</div>'+
     '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  for(const r of RES_ORDER){
    const v=pk[r]||0, t=RATE_TIERS[r];
    let rank=0;
    for(let i=0;i<t.length;i++) if(v>=t[i]) rank=i+1;
    const medal=['','● bronze','● silver','● gold'][rank];
    const mcol=['var(--faint)','#c08a5a','#b9c6c4','#ffcf4d'][rank];
    const next=rank<3?t[rank]:0;
    h+='<tr><td style="padding:3px 0;color:'+(v?RES_COL[r]:'var(--faint)')+'">'+r+'</td>'+
       '<td style="text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:8px">'+
       (v?v.toFixed(3):'—')+'</td>'+
       '<td style="width:66px;color:'+mcol+'">'+(medal||'')+'</td>'+
       '<td style="text-align:right;color:var(--faint);font-variant-numeric:tabular-nums">'+
       (next?'next '+next:'max')+'</td></tr>';
  }
  h+='</table>';
  h+=gatheredHtml()+historyHtml();
  h+='<div style="font-size:11px;color:var(--faint);margin-top:8px;line-height:1.45">'+
     'This is the whole history of your lab. Resetting the dish does not touch it.</div>';
  return h;
}
